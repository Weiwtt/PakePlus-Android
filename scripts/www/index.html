<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太乙神数排盘</title>
    <style>
        :root {
            --cell-size: 120px;
            --table-size: 600px;
            --bg: #1a1a2e;
            --panel-bg: #16213e;
            --text: #e0e0e0;
            --accent: #f0c040;
            --border: #444;
            --cell-border: #555;
            --highlight: #ff6b6b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .main-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }
        .panel {
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            width: 390px;
            max-width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }
        .panel h3 {
            color: var(--accent);
            margin-bottom: 14px;
            font-size: 1.2em;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            letter-spacing: 2px;
        }
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
            margin-bottom: 8px;
            align-items: center;
        }
        .input-group label {
            font-size: 0.9em;
            min-width: 35px;
        }
        .input-group input,
        .input-group select {
            background: #1a1a2e;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.9em;
            outline: none;
            min-width: 50px;
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--accent);
        }
        .input-group input[type="number"] {
            width: 70px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
            justify-content: left;
        }
        .btn {
            background: #2a2a4a;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            user-select: none;
            min-width: 44px;
            text-align: center;
        }
        .btn:hover {
            background: #3a3a5a;
            border-color: var(--accent);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85em;
        }
        .output-area {
            margin-top: 12px;
            padding: 12px;
            background: #0f0f1f;
            border-radius: 10px;
            border: 1px solid #333;
            max-height: 500px;
            overflow-y: auto;
            font-size: 0.9em;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .output-area .label {
            color: var(--accent);
            font-weight: bold;
        }
        .output-line {
            margin-bottom: 4px;
        }
        .editable-ganzhi {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            margin: 4px 0;
        }
        .editable-ganzhi input {
            background: #1a1a2e;
            border: 1px solid #555;
            color: #f0c040;
            padding: 3px 5px;
            border-radius: 4px;
            font-size: 0.9em;
            width: 55px;
            text-align: center;
            outline: none;
        }
        .checkbox-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin: 8px 0;
            font-size: 0.9em;
            justify-content: left;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .table-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        table.taiji-table {
            border-collapse: collapse;
            width: var(--table-size);
            height: var(--table-size);
            table-layout: fixed;
            background: #111;
            border: 3px solid #666;
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(240, 192, 64, 0.15), 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        table.taiji-table td {
            border: 1px solid #444;
            width: var(--cell-size);
            height: var(--cell-size);
            min-width: var(--cell-size);
            min-height: var(--cell-size);
            max-width: var(--cell-size);
            max-height: var(--cell-size);
            position: relative;
            padding: 0;
            background: #0d0d1a;
            vertical-align: middle;
            text-align: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        table.taiji-table td .cell-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            align-content: center;
            width: 100%;
            height: 100%;
            padding: 4px;
            gap: 2px;
            font-size: 11px;
            line-height: 1.2;
            word-break: keep-all;
            white-space: normal;
            overflow: hidden;
        }
        table.taiji-table td .cell-content .word-block {
            display: inline-block;
            white-space: nowrap;
            font-size: 13px;
            line-height: 1.2;
            padding: 0 1px;
            color: #f0e0c0;
            font-weight: 500;
            text-shadow: 0 0 4px rgba(240, 192, 64, 0.3);
        }
        table.taiji-table td .corner-bl {
            position: absolute;
            bottom: 2px;
            left: 3px;
            font-size: 18px;
            color: #4f4f4f;
            font-weight: bold;
            pointer-events: none;
            z-index: 2;
            text-shadow: 0 0 3px rgba(80, 160, 255, 0.5);
        }
        table.taiji-table td .corner-br {
            position: absolute;
            bottom: 2px;
            right: 3px;
            font-size: 18px;
            color: #4f4f4f;
            font-weight: bold;
            pointer-events: none;
            z-index: 2;
            text-shadow: 0 0 3px rgba(80, 160, 255, 0.5);
        }
        .center-cell-highlight {
            background: #1a1a30 !important;
        }
        @media (max-width: 900px) {
			:root {
				/* 表格宽度：视口宽度 - 边距，同时不超过视口高度留出面板空间，最大600px */
				--table-size: min(calc(100vw - 16px), calc(100vh - 240px), 600px);
			}
			body {
				padding: 8px;
			}
			.main-container {
				flex-direction: column;
				align-items: center;
				gap: 12px;
				width: 100%;
			}
			.panel {
				order: 1;
				width: var(--table-size);
				max-width: var(--table-size);
				flex-shrink: 1;
				padding: 14px;
			}
			.table-wrapper {
				order: 2;
				width: var(--table-size);
			}
			table.taiji-table {
				width: var(--table-size);
				height: var(--table-size);
			}
			/* 单元格宽度动态跟随表格尺寸（表格宽度的 1/5） */
			table.taiji-table td {
				width: calc(var(--table-size) / 5);
				height: calc(var(--table-size) / 5);
				min-width: calc(var(--table-size) / 5);
				min-height: calc(var(--table-size) / 5);
				max-width: calc(var(--table-size) / 5);
				max-height: calc(var(--table-size) / 5);
			}
			table.taiji-table td .cell-content .word-block {
				font-size: 11px;
			}			
					
			table.taiji-table td .corner-bl,
			table.taiji-table td .corner-br {
				font-size: 14px;
			}
			table.taiji-table td .cell-content {
				padding: 2px;
				gap: 1px;
			}
		}

		@media (max-width: 400px) {
			:root {
				/* 更小屏幕：边距进一步缩小，让表格尽可能占满宽度 */
				--table-size: min(calc(100vw - 8px), calc(100vh - 200px), 480px);
			}
			body {
				padding: 4px;
			}
			.panel {
				padding: 10px;
			}
			table.taiji-table td .cell-content .word-block {
				font-size: 9px;
			}
			table.taiji-table td .corner-bl,
			table.taiji-table td .corner-br {
				font-size: 12px;
			}
		}
    </style>
</head>

            </div>
			

			
            <div class="btn-row">

                    <option value="0">子时</option>

                    <option value="3">卯时</option>
                    <option value="4">辰时</option>

                <button class="btn btn-sm" id="btnCalc">计算</button>
            </div>
			
			<div class="input-group" style="align-items: center;">
				<label style="min-width: 52px;">积时数</label>
				<input type="number" id="inputZ" style="width: 140px; font-size: 0.85em;" readonly>

			</div>

                <label><input type="checkbox" id="chkAuto" value="auto" checked> 自动</label>
            </div>
			
			<div class="checkbox-group">
				<label><input type="checkbox" id="chkShiJing"> 显示十精太乙</label>
			</div>
            
            <div class="output-area" id="outputArea">
                <div class="output-line">等待计算...</div>
				
            </div>
			<div class="editable-ganzhi" id="ganzhiEditArea">
					<span style="font-size:0.85em;"> </span>
					<input type="text" id="editYearGZ" value="丙午" >
					<span style="font-size:0.85em;"> </span>

					<span style="font-size:0.85em;"> </span>

					<span style="font-size:0.85em;"> </span>
					<input type="text" id="editHourGZ" value="己丑" >
			</div>
			
        </div>
        <div class="table-wrapper">
            <table class="taiji-table" id="taijiTable">
                <tbody id="tableBody"></tbody>
            </table>
			
        </div>
    </div>

            function getMonthGanzhiByDays(yearGanzhi, daysSinceLichun) {

				else if (ganIndex === 3 || ganIndex === 8) baseGan = 8; // 丁壬 -> 壬寅
				else baseGan = 0;                                       // 戊癸 -> 甲寅

				const stemIndex = (baseGan + (monthBranchIndex - 2 + 12) % 12) % 10;

            // ==================== 积时数 ====================
function calcJishishu(year, month, day, hourIndex) {
    // 参照点：以 604-10-29 子时为绝对时辰零点
    const REF_Y = 604, REF_M = 10, REF_D = 29;

    function daysFromRef(y, m, d) {
        return daysBetween(REF_Y, REF_M, REF_D, y, m, d);
    }

    // 输入的“绝对时辰数”（相对于 604-10-29 子时）
    const absHour = daysFromRef(year, month, day) * 12 + hourIndex;

    // === 各节点模块（按时间从晚到早排列） ===

    // 2044-11-11 子时 → 1
    const node2044 = { absHour: daysFromRef(2044, 11, 11) * 12 + 0, z: 1 };

    // 1962-02-05 丑时 → 44512295402（原基准，丑时 +1）
    const node1962 = { absHour: daysFromRef(1962, 2, 5) * 12 + 1, z: 1214762 };

    // 1684-12-08 子时 → 1
    const node1684 = { absHour: daysFromRef(1684, 12, 8) * 12 + 0, z: 1 };

    // 1324-10-29 子时 → 1
    const node1324 = { absHour: daysFromRef(1324, 10, 29) * 12 + 0, z: 1 };

    // 1100-03-01 子时 → 592825（新增校准锚点）
    const node1100 = { absHour: daysFromRef(1100, 3, 1) * 12 + 0, z: 592825 };

    // 1000-03-01 子时 → 154525
    const node1000 = { absHour: daysFromRef(1000, 3, 1) * 12 + 0, z: 154525 };

    // 964-11-28 子时 → 1
    const node964 = { absHour: daysFromRef(964, 11, 28) * 12 + 0, z: 1 };

    // 604-10-29 子时 → 1
    const node604 = { absHour: daysFromRef(604, 10, 29) * 12 + 0, z: 1 };

    // === 从晚到早，命中第一个“不晚于输入时间”的节点 ===
    if (absHour >= node2044.absHour) return node2044.z + (absHour - node2044.absHour);
    if (absHour >= node1962.absHour) return node1962.z + (absHour - node1962.absHour);
    if (absHour >= node1684.absHour) return node1684.z + (absHour - node1684.absHour);
    if (absHour >= node1324.absHour) return node1324.z + (absHour - node1324.absHour);
    if (absHour >= node1100.absHour) return node1100.z + (absHour - node1100.absHour);
    if (absHour >= node1000.absHour) return node1000.z + (absHour - node1000.absHour);
    if (absHour >= node964.absHour)  return node964.z  + (absHour - node964.absHour);
    if (absHour >= node604.absHour)  return node604.z  + (absHour - node604.absHour);

    // 早于 604-10-29 子时：用最早的节点倒推
    return node604.z + (absHour - node604.absHour);
}

                        isSameDate(year, month, day, year, xiazhi[0], xiazhi[1]);
                    const beforeDongzhi = isBeforeDate(year, month, day, year, dongzhi[0], dongzhi[1]);
                    if (afterXiazhi && beforeDongzhi) return 0; // 阴遁
                    const afterDongzhi = isAfterDate(year, month, day, year, dongzhi[0], dongzhi[1]) ||
                        isSameDate(year, month, day, year, dongzhi[0], dongzhi[1]);
                    const beforeXiazhi = isBeforeDate(year, month, day, year, xiazhi[0], xiazhi[1]);
                    if (afterDongzhi && beforeXiazhi) return 1; // 阳遁
                    if (afterDongzhi) return 1;
                    if (afterXiazhi && beforeDongzhi) return 0;
                    if (afterXiazhi) return 0;
                    return 1;
                } else if (autoFlag === 'yang') {
                    return 1;
                } else {
                    return 0;
                }
            }

            // ==================== 计算主算/客算/定算 ====================
            function calcSuan(startS, endS) {
                if (startS === endS) {
                    return S_VALUES[startS];
                }
                const startIdx = CW_ORDER.indexOf(startS);
                const endIdx = CW_ORDER.indexOf(endS);
                let positions = [];
                let i = startIdx;
                while (true) {
                    positions.push(CW_ORDER[i]);
                    if (CW_ORDER[i] === endS) break;
                    i = (i + 1) % CW_ORDER.length;
                }
                // 去掉最后一位（endS），因为需要到endS的前一位
                positions = positions.slice(0, -1);
                if (positions.length === 0) return S_VALUES[startS];
                let sum = 0;
                for (const s of positions) {
                    sum += S_VALUES[s];
                }
                // 减去值为1的位置数
                for (const s of positions) {
                    if (S_VALUES[s] === 1) sum -= 1;
                }
                // 如果起始位置值为1，再加1
                if (S_VALUES[startS] === 1) sum += 1;
                // 如果经过s1且起始不是s1，再加1
                if (positions.includes('s1') && startS !== 's1') sum += 1;
                return sum;
            }

            function getOnesDigit(num) {
                const abs = Math.abs(num);
                return abs % 10;
            }

            function calcDaJiang(suanValue) {
                if (suanValue === 0) return 0;
                const ones = getOnesDigit(suanValue);
                if (ones === 0) {
                    return suanValue % 9;
                }
                return ones;
            }

            function getCellBySuanValue(val) {
                if (val === 1) return 's1';
                if (val === 2) return 's11';
                if (val === 3) return 's5';
                if (val === 4) return 's7';
                if (val === 5) return 'center';
                if (val === 6) return 's15';
                if (val === 7) return 's13';
                if (val === 8) return 's3';
                if (val === 9) return 's9';
                return 'center';
            }

            function getCanJiangByDaJiang(dajiangS) {
                if (dajiangS === 'center') {
                    const centerVal = 5;
                    const multiplied = (centerVal * 3) % 10;
                    return getCellBySuanValue(multiplied);
                }
                const val = S_VALUES[dajiangS];
                const multiplied = (val * 3) % 10;
                return getCellBySuanValue(multiplied);
            }

            function getCWDistance(fromS, toS) {
                const fromIdx = CW_ORDER.indexOf(fromS);
                const toIdx = CW_ORDER.indexOf(toS);
                let dist = 0;
                let i = fromIdx;
                while (CW_ORDER[i] !== toS) {
                    dist++;
                    i = (i + 1) % CW_ORDER.length;
                }
                return dist;
            }

            function moveCW(s, steps) {
                const idx = CW_ORDER.indexOf(s);
                return CW_ORDER[(idx + steps) % CW_ORDER.length];
            }

                    's3': '坎',
                    's5': '艮',
                    's7': '震',
                    's9': '巽',
                    's11': '离',
                    's13': '坤',
                    's15': '兑'
                };
                return mapping[taijiS] || '乾';
            }

            function getBaguaByIndex(index) {
                return BAGUA_CW_ORDER[((index % 8) + 8) % 8];
            }

				if (hourGan !== '甲') {
					const fixedMap = {
						'戊': 0, '己': 1, '庚': 2, '辛': 3, '壬': 4,
						'癸': 5, '丁': 6, '丙': 7, '乙': 8
					};
					startGongIndex = fixedMap[hourGan] !== undefined ? fixedMap[hourGan] : 4;
				} else {
					const jiaMap = {
						'天蓬': 0, '天芮': 1, '天冲': 2, '天辅': 3, '天禽': 4,
						'天心': 5, '天柱': 6, '天任': 7, '天英': 8
					};
					startGongIndex = jiaMap[tsta] !== undefined ? jiaMap[tsta] : 4;
				}

				const jxOffset = (startGongIndex - startStarIndex + 9) % 9;

				for (let i = 0; i < 9; i++) {
					const starName = jiuxingOrder[i];
					const gongIdx = (i + jxOffset) % 9;
					const [row, col] = gongOrder[gongIdx];
					addCellText(row, col, starName);
				}				
				
				if (document.getElementById('chkShiJing').checked) {
					// 十精太乙全部计算与写入
					// ===== 十精太乙 =====
					if (document.getElementById('chkShiJing').checked) {
						// 辅助函数：根据 da 值和映射数组写入文字
						function addShiJing(name, da, mappingArray) {
							if (da >= 0 && da < mappingArray.length) {
								const target = mappingArray[da];
								if (target === 'center') {
									addCellText(3, 3, name);
								} else if (target && S_MAP[target]) {
									const rc = S_MAP[target];
									addCellText(rc.row, rc.col, name);
								}
							}
						}

						// 1. 天皇 z%20
						const da1 = z % 20;
						const tianhuangYang = ['s13','s14','s15','s16','s1','s1','s2','s3','s4','s5','s5','s6','s7','s8','s9','s9','s10','s11','s12','s13'];
						const tianhuangYin  = ['s5','s6','s7','s8','s9','s9','s10','s11','s12','s13','s13','s14','s15','s16','s1','s1','s2','s3','s4','s5'];
						addShiJing('天皇', da1, flag === 1 ? tianhuangYang : tianhuangYin);

						// 2. 帝符 z%20
						const da2 = z % 20;
						const difuYang = ['s15','s16','s1','s2','s3','s3','s4','s5','s6','s7','s7','s8','s9','s10','s11','s11','s12','s13','s14','s15'];
						const difuYin  = [null,'s8','s9','s10','s11','s11','s12','s13','s14','s15','s15','s16','s1','s2','s3','s3','s4','s5','s6','s7'];
						addShiJing('帝符', da2, flag === 1 ? difuYang : difuYin);

						// 3. 天时 z%20
						const da3 = z % 20;
						const tianshiYang = []; tianshiYang[0]='s4'; tianshiYang[1]='s6'; tianshiYang[2]='s7'; tianshiYang[3]='s8'; tianshiYang[4]='s10'; tianshiYang[5]='s11'; tianshiYang[6]='s12'; tianshiYang[7]='s14'; tianshiYang[8]='s15'; tianshiYang[9]='s16'; tianshiYang[10]='s2'; tianshiYang[11]='s3';
						const tianshiYin = []; tianshiYin[0]='s12'; tianshiYin[1]='s14'; tianshiYin[2]='s15'; tianshiYin[3]='s16'; tianshiYin[4]='s2'; tianshiYin[5]='s3'; tianshiYin[6]='s4'; tianshiYin[7]='s6'; tianshiYin[8]='s7'; tianshiYin[9]='s8'; tianshiYin[10]='s10'; tianshiYin[11]='s11';
						addShiJing('天时', da3, flag === 1 ? tianshiYang : tianshiYin);

						// 4. 太尊 z%4
						const da4 = z % 4;
						const taizunYang = ['s7','s3','s15','s11'];
						const taizunYin  = ['s15','s11','s7','s3'];
						addShiJing('太尊', da4, flag === 1 ? taizunYang : taizunYin);

						// 5. 飞鸟 z%9
						const da5 = z % 9;
						const feiniaoYang = ['s9','s1','s11','s5','s7','center','s15','s13','s3'];
						const feiniaoYin  = ['s1','s9','s3','s13','s15','center','s7','s5','s11'];
						addShiJing('飞鸟', da5, flag === 1 ? feiniaoYang : feiniaoYin);

						// 6. 五行 z%5
						const da6 = z % 5;
						const wuxingYang = ['s13','s1','s3','s5','s9'];
						const wuxingYin  = ['s5','s9','s11','s13','s1'];
						addShiJing('五行', da6, flag === 1 ? wuxingYang : wuxingYin);

						// 7. 八风 z%9
						const da7 = z % 9;
						const bafengYang = ['s1','s11','s5','s7','center','s15','s14','s3','s9'];
						const bafengYin  = ['s9','s3','s13','s15','center','s7','s5','s11','s1'];
						addShiJing('八风', da7, flag === 1 ? bafengYang : bafengYin);

						// 8. 五风 z%9
						const da8 = z % 9;
						const wufengYang = ['s3','s1','s5','center','s13','s9','s11','s7','s15'];
						const wufengYin  = ['s11','s9','s13','center','s5','s1','s3','s15','s7'];
						addShiJing('五风', da8, flag === 1 ? wufengYang : wufengYin);

						// 9. 三风 z%9
						const da9 = z % 9;
						const sanfengYang = ['s3','s5','s13','s11','s15','s1','center','s9','s7'];
						const sanfengYin  = ['s11','s13','s5','s3','s7','s9','center','s1','s15'];
						addShiJing('三风', da9, flag === 1 ? sanfengYang : sanfengYin);

						// 10. 纪数
						const jus = yDun; // 局数，yDun 已在前面计算
						const da10 = jus % 8;
						const jishuYang = ['s9','s1','s11','s5','s7','s15','s13','s3'];
						const jishuYin  = ['s1','s9','s3','s13','s15','s7','s5','s11'];
						addShiJing('纪数', da10, flag === 1 ? jishuYang : jishuYin);
					}
				}
				

				
                // 更新显示
                updateTableDisplay();
				updateOutputDisplay({
					z: z,
					yearGZ: yearGZ,
					monthGZ: monthGZ,
					dayGZ: dayGZ,
					hourGZ: hourGZ,
					kongWang: kongWang,
					hourKongWang: hourKongWang,   // 新增
					dunOutput: dunOutput,
					s17: s17,
					s21: s21,
					s25: s25,
					jjStr: jjStr,
					flag: flag,
					tsta: tsta
				});
            }

            // ==================== 表格渲染 ====================
            function buildTable() {
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                for (let r = 1; r <= 5; r++) {
                    const tr = document.createElement('tr');
                    for (let c = 1; c <= 5; c++) {
                        const td = document.createElement('td');
                        td.id = `cell_${r}_${c}`;
                        td.innerHTML = `
                            <div class="cell-content" id="content_${r}_${c}"></div>
                            <span class="corner-bl" id="corner_bl_${r}_${c}"></span>
                            <span class="corner-br" id="corner_br_${r}_${c}"></span>
                        `;
                        tr.appendChild(td);
                    }
                    tbody.appendChild(tr);
                }
            }

            const EIGHT_DOOR_NAMES = ['开门', '休门', '生门', '伤门', '杜门', '景门', '死门', '惊门'];

			function updateTableDisplay() {
				const doorNames = ['开门', '休门', '生门', '伤门', '杜门', '景门', '死门', '惊门'];
				const jiuxingNames = ['天蓬', '天芮', '天冲', '天辅', '天禽', '天心', '天柱', '天任', '天英'];
				
				const colstar = ['太乙'];
				const colstara = ['文昌', '主大将', '主参将'];
				const colstarb = ['客大将', '客参将', '始击'];
				
				const shiJingNames = ['天皇','帝符','天时','太尊','飞鸟','五行','八风','五风','三风','纪数'];

				for (let r = 1; r <= 5; r++) {
					for (let c = 1; c <= 5; c++) {
						const key = getCellKey(r, c);
						const td = document.getElementById(`cell_${r}_${c}`);
						const contentDiv = document.getElementById(`content_${r}_${c}`);
						const blSpan = document.getElementById(`corner_bl_${r}_${c}`);
						const brSpan = document.getElementById(`corner_br_${r}_${c}`);
						if (!td || !contentDiv) continue;

						// 先移除该单元格上一次渲染的九星标签
						td.querySelectorAll('.jiuxing-label').forEach(el => el.remove());

						const texts = cellTexts[key] || [];
						contentDiv.innerHTML = '';

						for (const text of texts) {
							// 九星：直接挂到 td 上，绝对定位到顶部居中
							if (jiuxingNames.indexOf(text) !== -1) {
								const jxSpan = document.createElement('span');
								jxSpan.className = 'jiuxing-label';
								jxSpan.textContent = text;
								jxSpan.style.position = 'absolute';
								jxSpan.style.top = '2px';
								jxSpan.style.left = '50%';
								jxSpan.style.transform = 'translateX(-50%)';
								jxSpan.style.color = '#999999';
								jxSpan.style.fontWeight = 'bold';
								jxSpan.style.fontSize = '12px';
								jxSpan.style.whiteSpace = 'nowrap';
								jxSpan.style.zIndex = '5';
								jxSpan.style.pointerEvents = 'none';
								td.appendChild(jxSpan);
								continue;
							}

							const span = document.createElement('span');
							span.className = 'word-block';
							span.textContent = text;

							// 八门：红色加粗
							// 如果是八门，直接设置内联样式（红色 + 加粗 + 光晕）							
							if (doorNames.includes(text)) {
								span.className = 'corner-bl';
								span.style.color = '#fffafa';
								span.style.fontWeight = 'bold';
								//span.style.display = 'block';        // 让 span 独占一行，才能整行居中
								//span.style.textAlign = 'center';	// 文字水平居中
								//span.style.width = '100%';  
								
								//span.style.textAlign = 'center';
								//span.style.position = 'absolute';
								span.style.top = '60%';
								span.style.left = '50%';
								span.style.transform = 'translate(-50%, -50%)';
								//span.style.fontSize = '11px';
								//span.style.textShadow = '0 0 5px rgba(255,50,50,0.7)';
							}
							
							// 太乙星神颜色
							if (colstar.indexOf(text) !== -1) {
								span.style.color = '#00FFFF';
								span.style.fontWeight = 'bold';
								//span.style.textShadow = '0 0 5px rgba(255,50,50,0.7)';
							}
							
							// 文昌大小将
							if (colstara.includes(text)) {
								span.style.color = '#FFA500';
								span.style.fontWeight = 'bold';
								//span.style.textShadow = '0 0 5px rgba(255,50,50,0.7)';
							}
							
							// 始击大小将
							if (colstarb.includes(text)) {
								span.style.color = '#ff8c69';
								span.style.fontWeight = 'bold';
								//span.style.textShadow = '0 0 5px rgba(255,50,50,0.7)';
							}
							
							// 十精太乙：灰色显示
							if (shiJingNames.indexOf(text) !== -1) {
								span.style.color = '#4f4f4f';
								//span.style.fontSize = '11px';
							}

							contentDiv.appendChild(span);
						}

						const corner = cornerTexts[key] || { br: '', bl: '' };
						blSpan.textContent = corner.bl || '';
						brSpan.textContent = corner.br || '';
					}
				}
			}

            function updateOutputDisplay(data) {
                const area = document.getElementById('outputArea');
                let html = '';
                html +=
                    `<div class="output-line"><span class="label">积时数：</span>${data.z}</div>`;
                html += `<div class="output-line"><span class="label">${data.dunOutput}</span></div>`;
                //html +=
                    //`<div class="output-line"><span class="label">年干支：</span><span id="outYearGZ">${data.yearGZ}</span> <span class="label">月干支：</span><span id="outMonthGZ">${data.monthGZ}</span> <span class="label">日干支：</span><span id="outDayGZ">${data.dayGZ}</span> <span class="label">时干支：</span><span id="outHourGZ">${data.hourGZ}</span></div>`;
                html += `<div class="output-line"><span class="label">主算：</span>${data.s17}</div>`;
                html += `<div class="output-line"><span class="label">客算：</span>${data.s21}</div>`;
                html += `<div class="output-line"><span class="label">定算：</span>${data.s25}</div>`;
                html += `<div class="output-line"><span class="label">值使门：</span>${data.jjStr}</div>`;
				//html += `<div class="output-line"><span class="label">值使门：</span>${data.jjStr}</div>`;
				html += `<div class="output-line"><span class="label">直符：</span>${data.tsta}</div>`;   // 新增
				if (data.kongWang) {
					html += `<div class="output-line"><span class="label">${data.kongWang}</span></div>`;
				
				}
				// 时空亡（新增）
				if (data.hourKongWang) {
					html += `<div class="output-line"><span class="label">${data.hourKongWang}</span></div>`;
				}				
				
				
                area.innerHTML = html;

                document.getElementById('editYearGZ').value = data.yearGZ;
                document.getElementById('editMonthGZ').value = data.monthGZ;
                document.getElementById('editDayGZ').value = data.dayGZ;
                document.getElementById('editHourGZ').value = data.hourGZ;
            }

			function daysInMonth(year, month) {
				// month: 1-12，返回该月天数
				return new Date(year, month, 0).getDate();
			}

            // ==================== 事件绑定 ====================
            function initEvents() {
                document.getElementById('btnCalc').addEventListener('click', performCalculation);
				// 时辰减一（跨天/跨月/跨年自动回退）
				document.getElementById('btnMinusHour').addEventListener('click', function() {
					let year  = parseInt(document.getElementById('inputYear').value)  || 2026;
					let month = parseInt(document.getElementById('inputMonth').value) || 1;
					let day   = parseInt(document.getElementById('inputDay').value)   || 1;
					let hour  = parseInt(document.getElementById('inputHour').value)  || 0;

					hour -= 1;
					if (hour < 0) {
						hour = 11;              // 回到上一天的亥时
						day -= 1;
						if (day < 1) {
							month -= 1;
							if (month < 1) {
								month = 12;
								year -= 1;
							}
							day = daysInMonth(year, month);
						}
					}

					document.getElementById('inputYear').value  = year;
					document.getElementById('inputMonth').value = month;
					document.getElementById('inputDay').value   = day;
					document.getElementById('inputHour').value  = hour;
					document.getElementById('chkShiJing').addEventListener('change', performCalculation);
					document.getElementById('chkShiJing').addEventListener('change', performCalculation);
					document.getElementById('chkShiJing').addEventListener('click', function() {
						// 用 setTimeout 让勾选状态先更新
						setTimeout(performCalculation, 0);
					});
					performCalculation();
				});

				// 时辰加一（跨天/跨月/跨年自动进位）
				document.getElementById('btnPlusHour').addEventListener('click', function() {
					let year  = parseInt(document.getElementById('inputYear').value)  || 2026;
					let month = parseInt(document.getElementById('inputMonth').value) || 1;
					let day   = parseInt(document.getElementById('inputDay').value)   || 1;
					let hour  = parseInt(document.getElementById('inputHour').value)  || 0;

					hour += 1;
					if (hour > 11) {
						hour = 0;               // 进入下一天的子时
						day += 1;
						if (day > daysInMonth(year, month)) {
							day = 1;
							month += 1;
							if (month > 12) {
								month = 1;
								year += 1;
							}
						}
					}

					document.getElementById('inputYear').value  = year;
					document.getElementById('inputMonth').value = month;
					document.getElementById('inputDay').value   = day;
					document.getElementById('inputHour').value  = hour;
					performCalculation();
				});

                const chkYang = document.getElementById('chkYang');
                const chkYin = document.getElementById('chkYin');
                const chkAuto = document.getElementById('chkAuto');
                chkYang.addEventListener('change', function() {
                    if (chkYang.checked) { chkYin.checked = false;
                        chkAuto.checked = false; }
                    performCalculation();
                });
                chkYin.addEventListener('change', function() {
                    if (chkYin.checked) { chkYang.checked = false;
                        chkAuto.checked = false; }
                    performCalculation();
                });
                chkAuto.addEventListener('change', function() {
                    if (chkAuto.checked) { chkYang.checked = false;
                        chkYin.checked = false; }
                    performCalculation();
                });

                const ganZhiInputs = ['editYearGZ', 'editMonthGZ', 'editDayGZ', 'editHourGZ'];
                ganZhiInputs.forEach(id => {
                    document.getElementById(id).addEventListener('change', function() {
                        // 允许用户修改显示，不影响计算
                        const area = document.getElementById('outputArea');
                        const spans = area.querySelectorAll('#outYearGZ, #outMonthGZ, #outDayGZ, #outHourGZ');
                        if (id === 'editYearGZ') {
                            const span = area.querySelector('#outYearGZ');
                            if (span) span.textContent = this.value;
                        }
                        if (id === 'editMonthGZ') {
                            const span = area.querySelector('#outMonthGZ');
                            if (span) span.textContent = this.value;
                        }
                        if (id === 'editDayGZ') {
                            const span = area.querySelector('#outDayGZ');
                            if (span) span.textContent = this.value;
                        }
                        if (id === 'editHourGZ') {
                            const span = area.querySelector('#outHourGZ');
                            if (span) span.textContent = this.value;
                        }
                    });
                });

                document.getElementById('inputYear').addEventListener('change', performCalculation);
                document.getElementById('inputMonth').addEventListener('change', performCalculation);
                document.getElementById('inputDay').addEventListener('change', performCalculation);
                document.getElementById('inputHour').addEventListener('change', performCalculation);
				// 切换“手动”勾选框时，控制输入框可编辑性
				document.getElementById('chkManualZ').addEventListener('change', function() {
					const input = document.getElementById('inputZ');
					input.readOnly = !this.checked;
					if (!this.checked) {
						performCalculation();  // 取消手动时恢复自动值
					}
				});

				// 手动修改积时数后立即重算
				document.getElementById('inputZ').addEventListener('change', function() {
					if (document.getElementById('chkManualZ').checked) {
						performCalculation();
					}
				});
				
				const chkSJ = document.getElementById('chkShiJing');
				if (chkSJ) {
					chkSJ.addEventListener('change', performCalculation);
				}		
            }

            function initDefaultDate() {
                const now = new Date();
                document.getElementById('inputYear').value = now.getFullYear();
                document.getElementById('inputMonth').value = now.getMonth() + 1;
                document.getElementById('inputDay').value = now.getDate();
                document.getElementById('inputHour').value = getCurrentHourIndex();
            }

            // ==================== 启动 ====================
            function init() {
                buildTable();
                initDefaultDate();
                initEvents();
                performCalculation();
            }

            init();
        })();
    </script>
