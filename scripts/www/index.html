<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>太乙神数排盘</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px;color:#111;background:#f2f3f5;
    display:flex;justify-content:center;
    -webkit-text-size-adjust:100%;
  }
  #app{
    display:flex;flex-wrap:wrap;gap:14px;padding:10px;
    justify-content:center;align-items:flex-start;
    width:100%;max-width:1080px;
  }
  /* 左侧信息区 */
  #left{
    flex:1 1 340px;min-width:0;max-width:470px;
    background:#fff;border:1px solid #dcdfe6;border-radius:8px;
    padding:10px 12px;
  }
  #left .row{margin:6px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  #left label{display:inline-flex;align-items:center;gap:3px;}
  #left input[type=number]{
    width:64px;padding:3px 4px;border:1px solid #c9ccd1;border-radius:4px;
    font-size:13px;text-align:center;
  }
  #left input.gz{width:56px;padding:3px 2px;border:1px solid #c9ccd1;border-radius:4px;
    font-size:14px;text-align:center;font-weight:600;color:#0b5;}
  #left button{
    padding:4px 10px;border:1px solid #c9ccd1;background:#fff;border-radius:4px;
    font-size:13px;cursor:pointer;
  }
  #left button:active{background:#eef;}
  #out{margin-top:8px;line-height:1.9;font-size:14px;}
  #out .big{font-weight:700;color:#b00;font-size:15px;}
  /* 表格区 */
  #tableWrap{
    flex:1 1 420px;min-width:0;max-width:600px;
    width:100%;aspect-ratio:1/1;
  }
  table#grid{
    width:100%;height:100%;
    border-collapse:collapse;table-layout:fixed;
    background:#fff;
  }
  table#grid td{
    width:20%;height:20%;
    border:1px solid #444;
    padding:0;position:relative;overflow:hidden;
    vertical-align:top;
  }
  .cwrap{position:absolute;inset:0;}
  .flow{
    position:absolute;left:2px;right:2px;top:1px;
    font-size:12px;line-height:1.15;color:#045;
  }
  .flow .w{display:inline-block;}
  .centerText{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;font-size:14px;font-weight:700;color:#000;
    pointer-events:none;
  }
  .corner-bl{position:absolute;left:3px;bottom:1px;font-size:16px;line-height:1;color:#000;}
  .corner-br{position:absolute;right:3px;bottom:1px;font-size:16px;line-height:1;color:#000;}

  /* 手机端：上下排列，两区等宽 */
  @media (max-width:780px){
    #app{flex-direction:column;align-items:stretch;padding:8px;gap:10px;}
    #left,#tableWrap{width:100%;max-width:100%;flex:0 0 auto;}
    #tableWrap{aspect-ratio:1/1;}
    #left{max-width:100%;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div class="row">
      <label><input id="inY" type="number">年</label>
      <label><input id="inM" type="number" min="1" max="12">月</label>
      <label><input id="inD" type="number" min="1" max="31">日</label>
      <label><input id="inH" type="number" min="0" max="23">时</label>
    </div>
    <div class="row">
      <button id="btnPrev" type="button">－1时辰</button>
      <button id="btnNext" type="button">＋1时辰</button>
      <span id="curInfo" style="color:#666"></span>
    </div>
    <div class="row">
      选择阴阳遁：
      <label><input type="radio" name="flagSel" value="yang">阳遁</label>
      <label><input type="radio" name="flagSel" value="yin">阴遁</label>
      <label><input type="radio" name="flagSel" value="auto" checked>自动</label>
    </div>
    <div class="row">
      <input class="gz" id="gzY" type="text" title="年干支">
      <input class="gz" id="gzM" type="text" title="月干支">
      <input class="gz" id="gzD" type="text" title="日干支">
      <input class="gz" id="gzH" type="text" title="时干支">
    </div>
    <div id="out"></div>
  </div>

  <div id="tableWrap">
    <table id="grid"></table>
  </div>
</div>

<script>
(function(){
'use strict';

/* ================= 基础常量 ================= */
const GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const JIAZI=[];
for(let i=0;i<60;i++) JIAZI.push(GAN[i%10]+ZHI[i%12]);

/* 立春 / 夏至 / 冬至 数据表： [立春月,立春日,夏至月,夏至日,冬至月,冬至日] */
const TERM_TABLE={
1960:[2,5,6,21,12,22],1961:[2,4,6,21,12,22],1962:[2,4,6,22,12,22],1963:[2,4,6,22,12,22],
1964:[2,5,6,21,12,22],1965:[2,4,6,21,12,22],1966:[2,4,6,22,12,22],1967:[2,4,6,22,12,22],
1968:[2,5,6,21,12,21],1969:[2,4,6,22,12,22],1970:[2,4,6,22,12,22],1971:[2,4,6,22,12,22],
1972:[2,5,6,21,12,21],1973:[2,4,6,22,12,22],1974:[2,4,6,22,12,22],1975:[2,4,6,22,12,22],
1976:[2,5,6,21,12,21],1977:[2,4,6,22,12,22],1978:[2,4,6,22,12,22],1979:[2,4,6,22,12,22],
1980:[2,5,6,21,12,22],1981:[2,4,6,22,12,22],1982:[2,4,6,22,12,22],1983:[2,4,6,22,12,22],
1984:[2,4,6,21,12,21],1985:[2,4,6,21,12,22],1986:[2,4,6,22,12,22],1987:[2,4,6,22,12,22],
1988:[2,4,6,21,12,21],1989:[2,4,6,21,12,22],1990:[2,4,6,21,12,22],1991:[2,4,6,22,12,22],
1992:[2,4,6,21,12,21],1993:[2,4,6,21,12,22],1994:[2,4,6,21,12,22],1995:[2,4,6,22,12,22],
1996:[2,4,6,21,12,21],1997:[2,4,6,21,12,22],1998:[2,4,6,21,12,22],1999:[2,4,6,22,12,22],
2000:[2,4,6,21,12,21],2001:[2,4,6,21,12,22],2002:[2,4,6,21,12,22],2003:[2,4,6,22,12,22],
2004:[2,4,6,21,12,21],2005:[2,4,6,21,12,22],2006:[2,4,6,21,12,22],2007:[2,4,6,22,12,22],
2008:[2,4,6,21,12,21],2009:[2,4,6,21,12,22],2010:[2,4,6,21,12,22],2011:[2,4,6,22,12,22],
2012:[2,4,6,21,12,21],2013:[2,4,6,21,12,22],2014:[2,4,6,21,12,22],2015:[2,4,6,22,12,22],
2016:[2,4,6,21,12,21],2017:[2,3,6,21,12,22],2018:[2,4,6,21,12,22],2019:[2,4,6,21,12,22],
2020:[2,4,6,21,12,21],2021:[2,3,6,21,12,21],2022:[2,4,6,21,12,22],2023:[2,4,6,21,12,22],
2024:[2,4,6,21,12,21],2025:[2,3,6,21,12,21],2026:[2,4,6,21,12,22],2027:[2,4,6,21,12,22],
2028:[2,4,6,21,12,21],2029:[2,3,6,21,12,21],2030:[2,4,6,21,12,22],2031:[2,4,6,21,12,22],
2032:[2,4,6,21,12,21],2033:[2,3,6,21,12,21],2034:[2,4,6,21,12,22],2035:[2,4,6,21,12,22],
2036:[2,4,6,21,12,21],2037:[2,3,6,21,12,21],2038:[2,4,6,21,12,22],2039:[2,4,6,21,12,22],
2040:[2,4,6,21,12,21],2041:[2,3,6,21,12,21],2042:[2,4,6,21,12,22],2043:[2,4,6,21,12,22],
2044:[2,4,6,20,12,21],2045:[2,3,6,21,12,21],2046:[2,4,6,21,12,22],2047:[2,4,6,21,12,22],
2048:[2,4,6,20,12,21],2049:[2,3,6,21,12,21],2050:[2,4,6,21,12,22],2051:[2,4,6,21,12,22],
2052:[2,4,6,20,12,21],2053:[2,3,6,21,12,21],2054:[2,4,6,21,12,22],2055:[2,4,6,21,12,22],
2056:[2,4,6,20,12,21],2057:[2,3,6,21,12,21],2058:[2,4,6,21,12,22],2059:[2,4,6,21,12,22],
2060:[2,4,6,20,12,21],2061:[2,3,6,21,12,21],2062:[2,4,6,21,12,22],2063:[2,4,6,21,12,22],
2064:[2,4,6,20,12,21],2065:[2,3,6,21,12,21],2066:[2,4,6,21,12,22],2067:[2,4,6,21,12,22],
2068:[2,4,6,20,12,21],2069:[2,3,6,21,12,21],2070:[2,4,6,21,12,22],2071:[2,4,6,21,12,22],
2072:[2,4,6,20,12,21],2073:[2,3,6,21,12,21],2074:[2,4,6,21,12,22],2075:[2,4,6,21,12,22],
2076:[2,4,6,20,12,21],2077:[2,3,6,21,12,21],2078:[2,4,6,21,12,22],2079:[2,4,6,21,12,22],
2080:[2,4,6,20,12,21],2081:[2,3,6,21,12,21],2082:[2,4,6,21,12,22],2083:[2,4,6,21,12,22],
2084:[2,4,6,20,12,21],2085:[2,3,6,21,12,21],2086:[2,3,6,21,12,21]
};

function termOf(y){
  const t=TERM_TABLE[y];
  if(t) return {lichun:[t[0],t[1]],xiazhi:[t[2],t[3]],dongzhi:[t[4],t[5]]};
  return {lichun:[2,4],xiazhi:[6,22],dongzhi:[12,21]};
}

/* ================= 日期工具 ================= */
const MS_H=3600000, MS_D=86400000;
function dayNum(y,m,d){ return Math.round(Date.UTC(y,m-1,d)/MS_D); }
const BASE_DAY=dayNum(2026,8,15);   /* 2026-08-15 为 辛酉日 */
function dayIdxFromDN(dn){ let n=(57+(dn-BASE_DAY))%60; return ((n%60)+60)%60; }
function dayIdx(y,m,d){ return dayIdxFromDN(dayNum(y,m,d)); }

/* 时辰起点毫秒（子时从前一日23:00开始） */
function shichenStartMs(y,m,d,h){
  const base=dayNum(y,m,d)*MS_D;
  if(h>=23) return base+23*MS_H;
  if(h===0)  return base-MS_H;
  const s=(h%2===1)?h:h-1;
  return base+s*MS_H;
}
function zhiOfHour(h){ return Math.floor(((h+1)%24)/2); }

/* ================= 积时数 z ================= */
function resetMomentForYear(Y){
  const t=termOf(Y).dongzhi;
  const dn=dayNum(Y,t[0],t[1]);
  const idx=dayIdxFromDN(dn);       /* 0 表示该日就是甲子日 */
  const jd=dn-idx;                  /* 冬至日或之前最近的甲子日 */
  return jd*MS_D - MS_H;            /* 甲子日的子时（前一日23:00） */
}
function computeZ(y,m,d,h){
  const cur=Date.UTC(y,m-1,d,h);
  let best=-Infinity;
  for(let Y=y;Y>=y-3;Y--){
    const rm=resetMomentForYear(Y);
    if(rm<=cur && rm>best) best=rm;
  }
  const start=shichenStartMs(y,m,d,h);
  return 1 + Math.round((start-best)/(2*MS_H));
}

/* ================= 阴阳遁 ================= */
function autoFlag(y,m,d){
  const t=termOf(y);
  const dn=dayNum(y,m,d);
  const dz=dayNum(y,t.dongzhi[0],t.dongzhi[1]);
  const xz=dayNum(y,t.xiazhi[0],t.xiazhi[1]);
  if(dn>=dz || dn<xz) return 1;   /* 阳遁 */
  return 0;                        /* 阴遁 */
}

/* ================= 四柱 ================= */
function yearGZ(y,m,d){
  const t=termOf(y);
  let Y=y;
  if(dayNum(y,m,d) < dayNum(y,t.lichun[0],t.lichun[1])) Y=y-1;
  const idx=(((38+(Y-1962))%60)+60)%60;   /* 1962 立春 -> 壬寅(38) */
  return {Y:Y, idx:idx, ganzhi:JIAZI[idx]};
}

function monthGZ(y,m,d,yearIdx){
  const t=termOf(y);
  let lcD=dayNum(y,t.lichun[0],t.lichun[1]);
  if(dayNum(y,m,d)<lcD){
    const t0=termOf(y-1);
    lcD=dayNum(y-1,t0.lichun[0],t0.lichun[1]);
  }
  const diff=dayNum(y,m,d)-lcD;
  const bounds=[0,30,60,91,122,153,185,216,247,277,306,336];
  let mo=0;
  for(let i=bounds.length-1;i>=0;i--){ if(diff>=bounds[i]){mo=i;break;} }
  const zhiIdx=(2+mo)%12;                 /* 0->寅 */
  const yg=yearIdx%10;
  const startGan=(2+2*(yg%5))%10;
  const ganIdx=(startGan+mo)%10;
  for(let i=0;i<60;i++) if(i%10===ganIdx && i%12===zhiIdx)
    return {idx:i,ganzhi:JIAZI[i]};
  return {idx:0,ganzhi:JIAZI[0]};
}

function dayGZ(y,m,d,h){
  let yy=y,mm=m,dd=d;
  if(h>=23){
    const dt=new Date(Date.UTC(y,m-1,d+1));
    yy=dt.getUTCFullYear(); mm=dt.getUTCMonth()+1; dd=dt.getUTCDate();
  }
  const idx=dayIdx(yy,mm,dd);
  return {idx:idx,ganzhi:JIAZI[idx]};
}

function hourGZ(dayGan,h){
  const zi=zhiOfHour(h);
  const startGan=(2*(dayGan%5))%10;
  const ganIdx=(startGan+zi)%10;
  for(let i=0;i<60;i++) if(i%10===ganIdx && i%12===zi)
    return {idx:i,ganzhi:JIAZI[i],zhi:zi};
  return {idx:0,ganzhi:JIAZI[0],zhi:zi};
}

/* ================= 空亡 ================= */
function kongwang(dayIdxV){
  const group=Math.floor(dayIdxV/10);
  const table=[[10,11],[8,9],[6,7],[4,5],[2,3],[0,1]];
  return ZHI[table[group][0]]+'、'+ZHI[table[group][1]];
}

/* ================= 宫位定义 ================= */
const POS={
  s1:[5,5], s2:[5,4], s3:[5,3], s4:[5,2], s5:[5,1],
  s6:[4,1], s7:[3,1], s8:[2,1], s9:[1,1], s10:[1,2],
  s11:[1,3],s12:[1,4],s13:[1,5],s14:[2,5],s15:[3,5],s16:[4,5]
};
const POSVAL={s1:1,s2:1,s3:8,s4:1,s5:3,s6:1,s7:4,s8:1,
              s9:9,s10:1,s11:2,s12:1,s13:7,s14:1,s15:6,s16:1};
const ORDER=['s1','s2','s3','s4','s5','s6','s7','s8',
             's9','s10','s11','s12','s13','s14','s15','s16'];

let cellFlow={}, cellCenter={};

/* 宫格内文字的显示颜色 */
const FLOW_COLOR={
  '太乙'  :'#00bcd4',   /* 青色 */
  '文昌'  :'#e0a800',   /* 黄色 */
  '主大将':'#e0a800',
  '主参将':'#e0a800',
  '始击'  :'#e60012',   /* 红色 */
  '客大将':'#e60012',
  '客参将':'#e60012'
};

function keyOf(p){ if(p==='center') return '3,3'; const q=POS[p]; return q[0]+','+q[1]; }
function place(label,p){ const k=keyOf(p); (cellFlow[k]=cellFlow[k]||[]).push(label); }
function placeCenter(label,p){ cellCenter[keyOf(p)]=label; }

function clockwiseDist(from,to){
  const i1=ORDER.indexOf(from), i2=ORDER.indexOf(to);
  return ((i2-i1)%16+16)%16;
}
/* 从 start 顺时针数到 end（含首尾）的“算” */
function computeSuan(startPos,taiyiPos){
  if(startPos===taiyiPos) return POSVAL[startPos];
  const ti=ORDER.indexOf(taiyiPos);
  const endPos=ORDER[(ti-1+16)%16];
  const steps=clockwiseDist(startPos,endPos);
  const si=ORDER.indexOf(startPos);
  let sum=0, ones=0, visited=[];
  for(let k=0;k<=steps;k++){
    const p=ORDER[(si+k)%16];
    visited.push(p);
    sum+=POSVAL[p];
    if(POSVAL[p]===1) ones++;
  }
  let s=sum-ones;
  if(POSVAL[startPos]===1) s+=1;
  if(visited.indexOf('s1')>=0 && startPos!=='s1') s+=1;
  return s;
}
function posByNum(n){
  const M={1:'s1',2:'s11',3:'s5',4:'s7',5:'center',6:'s15',7:'s13',8:'s3',9:'s9'};
  return M[n]||'center';
}
function generalNumOf(v){
  const d=v%10;
  if(d===0) return v%9;
  return d;
}

/* ================= 建表 ================= */
const CORNERS={
  '2,2':['九','巽'],'2,3':['二','离'],'2,4':['七','坤'],
  '3,2':['四','震'],'3,4':['六','兑'],
  '4,2':['三','艮'],'4,3':['八','坎'],'4,4':['一','乾']
};
function buildTable(){
  const tbl=document.getElementById('grid');
  for(let r=1;r<=5;r++){
    const tr=document.createElement('tr');
    for(let c=1;c<=5;c++){
      const td=document.createElement('td');
      td.dataset.key=r+','+c;
      td.innerHTML='<div class="cwrap">'+
        '<div class="flow"></div>'+
        '<div class="centerText"></div>'+
        '<div class="corner-bl"></div>'+
        '<div class="corner-br"></div>'+
        '</div>';
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
  for(const k in CORNERS){
    const td=tbl.querySelector('td[data-key="'+k+'"]');
    td.querySelector('.corner-bl').textContent=CORNERS[k][0];
    td.querySelector('.corner-br').textContent=CORNERS[k][1];
  }
}
function renderCells(){
  document.querySelectorAll('#grid td').forEach(function(td){
    const k=td.dataset.key;
    const arr=cellFlow[k]||[];
    td.querySelector('.flow').innerHTML=
      arr.map(function(t){
        const c=FLOW_COLOR[t];
        return '<span class="w"'+
               (c?' style="color:'+c+';font-weight:700"':'')+'>'+
               t+'</span>';
      }).join(' ');
    td.querySelector('.centerText').textContent=cellCenter[k]||'';
  });
}

/* ================= 主计算 ================= */
const inY=document.getElementById('inY'),
      inM=document.getElementById('inM'),
      inD=document.getElementById('inD'),
      inH=document.getElementById('inH'),
      gzY=document.getElementById('gzY'),
      gzM=document.getElementById('gzM'),
      gzD=document.getElementById('gzD'),
      gzH=document.getElementById('gzH'),
      out=document.getElementById('out'),
      curInfo=document.getElementById('curInfo');

function calc(){
  const y=parseInt(inY.value,10), m=parseInt(inM.value,10),
        d=parseInt(inD.value,10), h=parseInt(inH.value,10);
  if(!y||!m||!d||isNaN(h)) return;

  cellFlow={}; cellCenter={};

  const z=computeZ(y,m,d,h);

  const sel=document.querySelector('input[name="flagSel"]:checked').value;
  const flag = (sel==='auto') ? autoFlag(y,m,d) : (sel==='yang'?1:0);

  /* ---- 四柱 ---- */
  const YG=yearGZ(y,m,d);
  const MG=monthGZ(y,m,d,YG.idx);
  const DG=dayGZ(y,m,d,h);
  const HG=hourGZ(DG.idx%10,h);
  const zhiName=ZHI[HG.zhi];
  const hourZhiIdx=HG.zhi;

  /* 用户可编辑的干支显示 */
  gzY.value=YG.ganzhi; gzM.value=MG.ganzhi;
  gzD.value=DG.ganzhi; gzH.value=HG.ganzhi;

  /* ---- 局 ---- */
  const y72=z%72;
  const ju=(y72===0)?72:y72;

  /* ---- 太乙 ---- */
  const a1=z%24;
  let taiyi;
  if(a1>=1&&a1<=3)        taiyi = flag?'s1':'s9';
  else if(a1>=4&&a1<=6)   taiyi = flag?'s11':'s3';
  else if(a1>=7&&a1<=9)   taiyi = flag?'s5':'s13';
  else if(a1>=10&&a1<=12) taiyi = flag?'s7':'s15';
  else if(a1>=13&&a1<=15) taiyi = flag?'s15':'s7';
  else if(a1>=16&&a1<=18) taiyi = flag?'s13':'s5';
  else if(a1>=19&&a1<=21) taiyi = flag?'s3':'s11';
  else                    taiyi = flag?'s9':'s1';
  place('太乙',taiyi);

  /* ---- 文昌 ---- */
  const b=z%18;
  let wenchang;
  switch(b){
    case 1:  wenchang = flag?'s14':'s6';  break;
    case 2:  wenchang = flag?'s15':'s7';  break;
    case 3:  wenchang = flag?'s16':'s8';  break;
    case 4:  wenchang = flag?'s1' :'s9';  break;
    case 5:  wenchang = flag?'s1' :'s9';  break;
    case 6:  wenchang = flag?'s2' :'s10'; break;
    case 7:  wenchang = flag?'s3' :'s11'; break;
    case 8:  wenchang = flag?'s4' :'s12'; break;
    case 9:  wenchang = flag?'s5' :'s13'; break;
    case 10: wenchang = flag?'s6' :'s14'; break;
    case 11: wenchang = flag?'s7' :'s15'; break;
    case 12: wenchang = flag?'s8' :'s16'; break;
    case 13: wenchang = flag?'s9' :'s1';  break;
    case 14: wenchang = flag?'s10':'s2';  break;
    case 15: wenchang = flag?'s11':'s3';  break;
    case 16: wenchang = flag?'s12':'s4';  break;
    case 17: wenchang = flag?'s13':'s5';  break;
    default: wenchang = flag?'s13':'s5';  break;
  }
  place('文昌',wenchang);

  /* ---- 主算 ---- */
  const s17=computeSuan(wenchang,taiyi);
  const n17=generalNumOf(s17);
  const mainGenPos=posByNum(n17);
  place('主大将',mainGenPos);
  const valGen = (mainGenPos==='center')?5:POSVAL[mainGenPos];
  let n18=(valGen*3)%10; if(n18===0) n18=9;
  place('主参将',posByNum(n18));

  /* ---- 计神 ---- */
  const JS_YANG={'子':'s6','丑':'s4','寅':'s3','卯':'s2','辰':'s16','巳':'s15',
                 '午':'s14','未':'s12','申':'s11','酉':'s2','戌':'s8','亥':'s7'};
  const JS_YIN ={'子':'s14','丑':'s12','寅':'s11','卯':'s10','辰':'s8','巳':'s7',
                 '午':'s6','未':'s4','申':'s3','酉':'s2','戌':'s16','亥':'s15'};
  const jishen = flag? JS_YANG[zhiName] : JS_YIN[zhiName];
  place('计神',jishen);

  /* ---- 始击 ---- */
  let shiji;
  if(jishen==='s5'){
    shiji=wenchang;
  }else{
    const c1=clockwiseDist('s5',jishen);
    shiji=ORDER[(ORDER.indexOf(wenchang)+c1)%16];
  }
  place('始击',shiji);

  /* ---- 客算 ---- */
  const s21=computeSuan(shiji,taiyi);
  const n21=generalNumOf(s21);
  const keGenPos=posByNum(n21);
  place('客大将',keGenPos);
  const valKe=(keGenPos==='center')?5:POSVAL[keGenPos];
  let n22=(valKe*3)%10; if(n22===0) n22=9;
  place('客参将',posByNum(n22));

  /* ---- 太岁 ---- */
  const TAISUI={'子':'s3','丑':'s4','寅':'s6','卯':'s7','辰':'s8','巳':'s10',
                '午':'s11','未':'s12','申':'s14','酉':'s15','戌':'s16','亥':'s2'};
  const taisui=TAISUI[zhiName];
  place('太岁',taisui);

  /* ---- 太阴 ---- */
  const TAIYIN={'寅':'s3','卯':'s4','辰':'s6','巳':'s7','午':'s8','未':'s10',
                '申':'s11','酉':'s12','戌':'s14','亥':'s15','子':'s16','丑':'s2'};
  const taiyin=TAIYIN[zhiName];
  place('太阴',taiyin);

  /* ---- 合神 ---- */
  const HESHEN={'s3':'s4','s4':'s3','s6':'s2','s7':'s16','s8':'s15','s10':'s14',
                's11':'s12','s12':'s11','s14':'s10','s15':'s8','s16':'s7','s2':'s6'};
  const heshen=HESHEN[taisui];
  place('合神',heshen);

  /* ---- 定目 ---- */
  const v1=clockwiseDist(heshen,taisui);
  const dingmu=ORDER[(ORDER.indexOf(wenchang)+v1)%16];
  place('定目',dingmu);

  /* ---- 定算 ---- */
  const s25=computeSuan(dingmu,taiyi);
  const n25=generalNumOf(s25);
  const dingGenPos=posByNum(n25);
  place('定大将',dingGenPos);
  const valDing=(dingGenPos==='center')?5:POSVAL[dingGenPos];
  let n26=(valDing*3)%10; if(n26===0) n26=9;
  place('定参将',posByNum(n26));

  /* ============ 神煞类 ============ */
  /* 君基 */
  (function(){
    const z9=z%360;
    const q=z9/30;
    const z10=Number.isInteger(q)?q:Math.floor(q)+1;
    const M={1:'s11',2:'s12',3:'s14',4:'s15',5:'s16',6:'s2',
             7:'s3',8:'s4',9:'s6',10:'s7',11:'s8'};
    place('君基', M[z10]||'s10');
  })();

  /* 臣基 */
  (function(){
    const z14=(z%360)%36;
    const q=z14/3;
    const z15=Number.isInteger(q)?q:Math.floor(q)+1;
    const M={1:'s11',2:'s12',3:'s14',4:'s15',5:'s16',6:'s2',
             7:'s3',8:'s4',9:'s6',10:'s7',11:'s8'};
    place('臣基', M[z15]||'s10');
  })();

  /* 民基 */
  (function(){
    const z12=(z%360)%12;
    const M={1:'s16',2:'s2',3:'s3',4:'s4',5:'s6',6:'s7',
             7:'s8',8:'s10',9:'s11',10:'s12',11:'s14',0:'s15'};
    place('民基', M[z12]);
  })();

  /* 五福 */
  (function(){
    const z50=z%225;
    const q=z50/45;
    const z51=Number.isInteger(q)?q:Math.floor(q)+1;
    const M={1:'s1',2:'s5',3:'s9',4:'s13'};
    place('五福', M[z51]||'center');
  })();

  /* 大游 */
  (function(){
    const z60=z%288;
    const q=z60/36;
    const z61=Number.isInteger(q)?q:Math.floor(q)+1;
    const M={1:'s13',2:'s3',3:'s9',4:'s1',5:'s11',6:'s5',7:'s7'};
    place('大游', M[z61]||'s15');
  })();

  /* 小游 */
  (function(){
    const z71=(z%360)%24;
    const q=z71/3;
    const z72=Number.isInteger(q)?q:Math.floor(q)+1;
    const M={1:'s1',2:'s11',3:'s5',4:'s7',5:'s15',6:'s13',7:'s3'};
    place('小游', M[z72]||'s9');
  })();

  /* 四神 */
  (function(){
    const z81=(z%360)%36;
    const q=z81/3;
    const z82=Number.isInteger(q)?q:Math.floor(q)+1;
    const M={1:'s1',2:'s11',3:'s5',4:'s7',5:'center',6:'s15',
             7:'s13',8:'s3',9:'s9',10:'s10',11:'s14'};
    place('四神', M[z82]||'s6');
  })();

  /* 天乙 */
  (function(){
    const z91=(z%360)%36;
    const q=z91/3;
    const z92=Number.isInteger(q)?q:Math.floor(q)+1;
    const M={1:'s15',2:'s13',3:'s3',4:'s9',5:'s10',6:'s14',
             7:'s6',8:'s1',9:'s11',10:'s5',11:'s7'};
    place('天乙', M[z92]||'center');
  })();

  /* 地乙 */
  (function(){
    const z98=(z%360)%36;
    const q=z98/3;
    const z99=Number.isInteger(q)?q:Math.floor(q)+1;
    const M={1:'s9',2:'s10',3:'s14',4:'s6',5:'s1',6:'s11',
             7:'s5',8:'s7',9:'center',10:'s15',11:'s13'};
    place('地乙', M[z99]||'s3');
  })();

  /* 直符 */
  (function(){
    const z101=(z%360)%36;
    const q=z101/3;
    const z102=Number.isInteger(q)?q:Math.floor(q)+1;
    const M={1:'center',2:'s15',3:'s13',4:'s3',5:'s9',6:'s10',
             7:'s14',8:'s6',9:'s1',10:'s11',11:'s5'};
    place('直符', M[z102]||'s7');
  })();

  /* 太岁青龙旗 */
  (function(){
    const zl=z%12;
    const M={1:'s3',2:'s4',3:'s6',4:'s7',5:'s8',6:'s10',
             7:'s11',8:'s12',9:'s14',10:'s15',11:'s16',0:'s2'};
    place('青龙旗', M[zl]);
  })();

  /* 太阴黑旗 */
  (function(){
    const zh=(z%36);
    const q=zh/3;
    const zh1=Number.isInteger(q)?q:Math.floor(q)+1;
    const M={1:'s2',2:'s16',3:'s15',4:'s14',5:'s12',6:'s11',
             7:'s10',8:'s8',9:'s7',10:'s6',11:'s4'};
    place('黑旗', M[zh1]||'s3');
  })();

  /* 害气赤旗 */
  (function(){
    const zq=z%4;
    const M={1:'s2',2:'s14',3:'s10',0:'s6'};
    place('赤旗', M[zq]);
  })();

  /* ============ 八门 ============ */
  const JMEN=['开门','休门','生门','伤门','杜门','景门','死门','惊门'];
  const zb1=z%240;
  const q=zb1/30;
  let zb2=Number.isInteger(q)?q:Math.floor(q)+1;
  let jjIndex;
  if(flag===1){
    const M={1:0,2:1,3:2,4:3,5:4,6:5,7:6};
    jjIndex=(zb2 in M)?M[zb2]:7;
  }else{
    const M={1:4,2:5,3:6,4:7,5:0,6:1,7:2};
    jjIndex=(zb2 in M)?M[zb2]:3;
  }
  const zhishiMen=JMEN[jjIndex];

  /* 太乙 -> 八宫 */
  const TAIYI_TO_PALACE={'s1':'乾','s3':'坎','s5':'艮','s7':'震',
                         's9':'巽','s11':'离','s13':'坤','s15':'兑'};
  const PALACE_ORDER=['乾','坎','艮','震','巽','离','坤','兑'];
  const PALACE_CELL={'乾':'4,4','坎':'4,3','艮':'4,2','震':'3,2',
                     '巽':'2,2','离':'2,3','坤':'2,4','兑':'3,4'};
  const startPalace=TAIYI_TO_PALACE[taiyi];
  const pi=PALACE_ORDER.indexOf(startPalace);
  for(let k=0;k<8;k++){
    const pname=PALACE_ORDER[(pi+k)%8];
    const menName=JMEN[(jjIndex+k)%8];
    cellCenter[PALACE_CELL[pname]]=menName;
  }

  /* ---- 输出 ---- */
  let html='';
  html+='<div>空亡：'+kongwang(DG.idx)+'</div>';
  html+='<div>积时数：<span class="big">'+z+'</span></div>';
  html+='<div>'+(flag?'阳遁':'阴遁')+ju+'局</div>';
  
  html+='<div>主算：<span class="big">'+s17+'</span></div>';
  html+='<div>客算：<span class="big">'+s21+'</span></div>';
  html+='<div>定算：<span class="big">'+s25+'</span></div>';
  html+='<div>值使门：'+zhishiMen+'</div>';
  out.innerHTML=html;

  const zhiN=ZHI[zhiOfHour(h)];
  curInfo.textContent='（'+y+'年'+m+'月'+d+'日 '+zhiN+'时）';

  renderCells();
}

/* ================= 初始化 ================= */
let curDate=new Date();

function syncFromDate(){
  inY.value=curDate.getFullYear();
  inM.value=curDate.getMonth()+1;
  inD.value=curDate.getDate();
  inH.value=curDate.getHours();
}
function syncToDate(){
  const y=parseInt(inY.value,10),m=parseInt(inM.value,10),
        d=parseInt(inD.value,10),h=parseInt(inH.value,10);
  if(!y||!m||!d||isNaN(h)) return;
  curDate=new Date(y,m-1,d,h,0,0,0);
}
function go(deltaHours){
  syncToDate();
  curDate=new Date(curDate.getTime()+deltaHours*MS_H);
  syncFromDate();
  calc();
}

document.getElementById('btnPrev').addEventListener('click',function(){ go(-2); });
document.getElementById('btnNext').addEventListener('click',function(){ go(2); });

[inY,inM,inD,inH].forEach(function(el){
  el.addEventListener('change',function(){ syncToDate(); calc(); });
});
document.querySelectorAll('input[name="flagSel"]').forEach(function(el){
  el.addEventListener('change',function(){ calc(); });
});

buildTable();
syncFromDate();
calc();

})();
</script>
</body>
</html>
