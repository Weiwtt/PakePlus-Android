<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太乙神数排盘</title>
    <style>
        :root {
            --cell-size: 120px;
            --table-size: 600px;
            --bg: #1a1a2e;
            --panel-bg: #16213e;
            --text: #e0e0e0;
            --accent: #f0c040;
            --border: #444;
            --cell-border: #555;
            --highlight: #ff6b6b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .main-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }
        .panel {
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            width: 390px;
            max-width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }
        .panel h3 {
            color: var(--accent);
            margin-bottom: 14px;
            font-size: 1.2em;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            letter-spacing: 2px;
        }
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
            margin-bottom: 8px;
            align-items: center;
        }
        .input-group label {
            font-size: 0.9em;
            min-width: 35px;
        }
        .input-group input,
        .input-group select {
            background: #1a1a2e;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.9em;
            outline: none;
            min-width: 50px;
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--accent);
        }
        .input-group input[type="number"] {
            width: 70px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
            justify-content: left;
        }
        .btn {
            background: #2a2a4a;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            user-select: none;
            min-width: 44px;
            text-align: center;
        }
        .btn:hover {
            background: #3a3a5a;
            border-color: var(--accent);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85em;
        }
        .output-area {
            margin-top: 12px;
            padding: 12px;
            background: #0f0f1f;
            border-radius: 10px;
            border: 1px solid #333;
            max-height: 500px;
            overflow-y: auto;
            font-size: 0.9em;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .output-area .label {
            color: var(--accent);
            font-weight: bold;
        }
        .output-line {
            margin-bottom: 4px;
        }
        .editable-ganzhi {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            margin: 4px 0;
        }
        .editable-ganzhi input {
            background: #1a1a2e;
            border: 1px solid #555;
            color: #f0c040;
            padding: 3px 5px;
            border-radius: 4px;
            font-size: 0.9em;
            width: 55px;
            text-align: center;
            outline: none;
        }
        .checkbox-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin: 8px 0;
            font-size: 0.9em;
            justify-content: left;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .table-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        table.taiji-table {
            border-collapse: collapse;
            width: var(--table-size);
            height: var(--table-size);
            table-layout: fixed;
            background: #111;
            border: 3px solid #666;
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(240, 192, 64, 0.15), 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        table.taiji-table td {
            border: 1px solid #444;
            width: var(--cell-size);
            height: var(--cell-size);
            min-width: var(--cell-size);
            min-height: var(--cell-size);
            max-width: var(--cell-size);
            max-height: var(--cell-size);
            position: relative;
            padding: 0;
            background: #0d0d1a;
            vertical-align: middle;
            text-align: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        table.taiji-table td .cell-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            align-content: center;
            width: 100%;
            height: 100%;
            padding: 4px;
            gap: 2px;
            font-size: 11px;
            line-height: 1.2;
            word-break: keep-all;
            white-space: normal;
            overflow: hidden;
        }
        table.taiji-table td .cell-content .word-block {
            display: inline-block;
            white-space: nowrap;
            font-size: 13px;
            line-height: 1.2;
            padding: 0 1px;
            color: #f0e0c0;
            font-weight: 500;
            text-shadow: 0 0 4px rgba(240, 192, 64, 0.3);
        }
        table.taiji-table td .corner-bl {
            position: absolute;
            bottom: 2px;
            left: 3px;
            font-size: 16px;
            color: #ff9999;
            font-weight: bold;
            pointer-events: none;
            z-index: 2;
            text-shadow: 0 0 3px rgba(255, 80, 80, 0.5);
        }
        table.taiji-table td .corner-br {
            position: absolute;
            bottom: 2px;
            right: 3px;
            font-size: 16px;
            color: #99ccff;
            font-weight: bold;
            pointer-events: none;
            z-index: 2;
            text-shadow: 0 0 3px rgba(80, 160, 255, 0.5);
        }
        .center-cell-highlight {
            background: #1a1a30 !important;
        }
        @media (max-width: 900px) {
			:root {
				--table-size: min(calc(100vw - 16px), calc(100vh - 240px), 600px);
			}
			html, body {
				overflow-x: hidden;            /* 防止横向溢出裁剪边框 */
				max-width: 100vw;
			}
			body {
				padding: 8px;
			}
			.main-container {
				flex-direction: column;
				align-items: center;
				gap: 12px;
				width: 100%;
			}
			.panel {
				order: 1;
				width: var(--table-size);
				max-width: var(--table-size);
				flex-shrink: 1;
				padding: 14px;
			}
			.table-wrapper {
				order: 2;
				width: var(--table-size);
				max-width: 100%;
			}
			table.taiji-table {
				width: var(--table-size);
				height: var(--table-size);
				border-collapse: collapse;
				box-sizing: border-box;
				border: 2px solid #666;        /* 外框略细，避免被裁 */
			}
			table.taiji-table td {
				/* 关键：改为百分比宽度，不再用 calc 固定值，边框不会被挤出 */
				width: 20%;
				height: 20%;
				min-width: 0;
				min-height: 0;
				max-width: none;
				max-height: none;
				box-sizing: border-box;        /* 边框包含在宽度内 */
				border: 1px solid #444;
				padding: 0;
			}
			table.taiji-table td .cell-content {
				padding: 2px;
				gap: 1px;
				font-size: 8px;
			}
			table.taiji-table td .cell-content .word-block {
				font-size: 8px;
			}
			table.taiji-table td .corner-bl,
			table.taiji-table td .corner-br {
				font-size: 7px;
			}
		}

		@media (max-width: 400px) {
			:root {
				--table-size: min(calc(100vw - 8px), calc(100vh - 200px), 480px);
			}
			body {
				padding: 4px;
			}
			.panel {
				padding: 10px;
			}
			table.taiji-table {
				border: 1px solid #666;
			}
			table.taiji-table td .cell-content .word-block {
				font-size: 7px;
			}
			table.taiji-table td .corner-bl,
			table.taiji-table td .corner-br {
				font-size: 6px;
			}
		}
    </style>
</head>

            // ==================== 状态 ====================
            let cellTexts = {}; // { 'row_col': [] }
            let cornerTexts = {}; // { 'row_col': { br: '', bl: '' } }

            function getCellKey(row, col) {

            function setCornerText(row, col, position, text) {
                const key = getCellKey(row, col);
                if (!cornerTexts[key]) cornerTexts[key] = { br: '', bl: '' };
                cornerTexts[key][position] = text;
            }

            function setSCornerText(s, position, text) {
                const rc = S_MAP[s];
                setCornerText(rc.row, rc.col, position, text);
            }

            function clearAllCells() {
                cellTexts = {};
                cornerTexts = {};
            }

            // ==================== 日期工具 ====================
            function daysBetween(y1, m1, d1, y2, m2, d2) {
                const date1 = new Date(y1, m1 - 1, d1);
                const date2 = new Date(y2, m2 - 1, d2);
                const diff = Math.round((date2 - date1) / 86400000);
                return diff;
            }

            function getSolarTerm(year, termName) {
                if (year >= 1960 && year <= 2086) {
                    const data = solarTermsData[year];
                    if (data) return data[termName];
                }
                if (termName === 'lichun') return [2, 4];
                if (termName === 'xiazhi') return [6, 22];
                if (termName === 'dongzhi') return [12, 21];
                return [1, 1];
            }

            function isBeforeDate(y, m, d, ty, tm, td) {
                if (y < ty) return true;
                if (y > ty) return false;
                if (m < tm) return true;
                if (m > tm) return false;
                return d < td;
            }

            function isSameDate(y, m, d, ty, tm, td) {
                return y === ty && m === tm && d === td;
            }

            function isAfterDate(y, m, d, ty, tm, td) {
                return !isBeforeDate(y, m, d, ty, tm, td) && !isSameDate(y, m, d, ty, tm, td);
            }

            function getCurrentHourIndex() {
                const h = new Date().getHours();
                if (h >= 23 || h < 1) return 0;
                if (h >= 1 && h < 3) return 1;
                if (h >= 3 && h < 5) return 2;
                if (h >= 5 && h < 7) return 3;
                if (h >= 7 && h < 9) return 4;
                if (h >= 9 && h < 11) return 5;
                if (h >= 11 && h < 13) return 6;
                if (h >= 13 && h < 15) return 7;
                if (h >= 15 && h < 17) return 8;
                if (h >= 17 && h < 19) return 9;
                if (h >= 19 && h < 21) return 10;
                return 11;
            }

            function getShichenName(index) {
                return HOUR_NAMES[((index % 12) + 12) % 12];
            }

            // ==================== 干支计算 ====================
            function getStemBranch(index) {
                const normalized = ((index % 60) + 60) % 60;
                return SIXTY_JIAZI[normalized];
            }

            function getYearGanzhi(year, month, day) {
                const lichun = getSolarTerm(year, 'lichun');
                const isAfterLichun = isAfterDate(year, month, day, year, lichun[0], lichun[1]) ||
                    isSameDate(year, month, day, year, lichun[0], lichun[1]);
                let refYear = isAfterLichun ? year : year - 1;
                const refGanzhi = '壬寅';
                const refIndex = SIXTY_JIAZI.indexOf(refGanzhi);
                const diff = refYear - BASE_YEAR;
                return getStemBranch(refIndex + diff);
            }

            function getMonthGanzhi(year, month, day, yearGanzhi) {
				// 确定所属“太乙年”的立春日期
				let taiyiYear = year;
				const lichun = getSolarTerm(year, 'lichun');
				if (isBeforeDate(year, month, day, year, lichun[0], lichun[1])) {
					taiyiYear = year - 1;
				}
				const lichunOfTaiyiYear = getSolarTerm(taiyiYear, 'lichun');
				const daysSinceLichun = daysBetween(
					taiyiYear, lichunOfTaiyiYear[0], lichunOfTaiyiYear[1],
					year, month, day
				);
				return getMonthGanzhiByDays(yearGanzhi, daysSinceLichun);
			}

            function getMonthGanzhiByDays(yearGanzhi, daysSinceLichun) {
				// 根据立春后的天数确定月地支（严格按照文档阈值）
				let monthBranchIndex; // 0=子,1=丑,2=寅,...11=亥
				if (daysSinceLichun < 29) {
					monthBranchIndex = 2; // 寅
				} else if (daysSinceLichun < 60) {
					monthBranchIndex = 3; // 卯
				} else if (daysSinceLichun < 90) {
					monthBranchIndex = 4; // 辰
				} else if (daysSinceLichun < 121) {
					monthBranchIndex = 5; // 巳
				} else if (daysSinceLichun < 153) {
					monthBranchIndex = 6; // 午
				} else if (daysSinceLichun < 184) {
					monthBranchIndex = 7; // 未
				} else if (daysSinceLichun < 215) {
					monthBranchIndex = 8; // 申
				} else if (daysSinceLichun < 246) {
					monthBranchIndex = 9; // 酉
				} else if (daysSinceLichun < 276) {
					monthBranchIndex = 10; // 戌
				} else if (daysSinceLichun < 306) {
					monthBranchIndex = 11; // 亥
				} else if (daysSinceLichun < 335) {
					monthBranchIndex = 0; // 子
				} else {
					monthBranchIndex = 1; // 丑（直到下一立春）
				}

				// 根据年干确定寅月天干起始
				const ganIndex = HEAVEN_STEMS.indexOf(yearGanzhi[0]);
				let baseGan; // 寅月天干索引（0=甲,2=丙,4=戊,6=庚,8=壬）
				if (ganIndex === 0 || ganIndex === 5) baseGan = 2;      // 甲己 -> 丙寅
				else if (ganIndex === 1 || ganIndex === 6) baseGan = 4; // 乙庚 -> 戊寅
				else if (ganIndex === 2 || ganIndex === 7) baseGan = 6; // 丙辛 -> 庚寅
				else if (ganIndex === 3 || ganIndex === 8) baseGan = 8; // 丁壬 -> 壬寅
				else baseGan = 0;                                       // 戊癸 -> 甲寅

				const stemIndex = (baseGan + (monthBranchIndex - 2 + 12) % 12) % 10;
				return HEAVEN_STEMS[stemIndex] + EARTH_BRANCHES[monthBranchIndex];
			}

            function getDayGanzhi(year, month, day) {
                const refDate = BASE_GANZHI_DAY_DATE;
                const diff = daysBetween(refDate.year, refDate.month, refDate.day, year, month, day);
                const refIndex = SIXTY_JIAZI.indexOf(BASE_GANZHI_DAY);
                return getStemBranch(refIndex + diff);
            }
			
			function getKongWang(dayGanZhi) {
				const groups = [
					{ ganzhi: ['甲子','乙丑','丙寅','丁卯','戊辰','己巳','庚午','辛未','壬申','癸酉'], kong: '戌、亥' },
					{ ganzhi: ['甲戌','乙亥','丙子','丁丑','戊寅','己卯','庚辰','辛巳','壬午','癸未'], kong: '申、酉' },
					{ ganzhi: ['甲申','乙酉','丙戌','丁亥','戊子','己丑','庚寅','辛卯','壬辰','癸巳'], kong: '午、未' },
					{ ganzhi: ['甲午','乙未','丙申','丁酉','戊戌','己亥','庚子','辛丑','壬寅','癸卯'], kong: '辰、巳' },
					{ ganzhi: ['甲辰','乙巳','丙午','丁未','戊申','己酉','庚戌','辛亥','壬子','癸丑'], kong: '寅、卯' },
					{ ganzhi: ['甲寅','乙卯','丙辰','丁巳','戊午','己未','庚申','辛酉','壬戌','癸亥'], kong: '子、丑' }
				];
				for (const g of groups) {
					if (g.ganzhi.includes(dayGanZhi)) {
						return `空亡：${g.kong}`;
					}
				}
				return '';
			}

            function getHourGanzhi(dayGanzhi, hourIndex) {
                const ganIndex = HEAVEN_STEMS.indexOf(dayGanzhi[0]);
                let baseGan;
                if (ganIndex === 0 || ganIndex === 5) baseGan = 0; // 甲己 -> 甲子
                else if (ganIndex === 1 || ganIndex === 6) baseGan = 2; // 乙庚 -> 丙子
                else if (ganIndex === 2 || ganIndex === 7) baseGan = 4; // 丙辛 -> 戊子
                else if (ganIndex === 3 || ganIndex === 8) baseGan = 6; // 丁壬 -> 庚子
                else baseGan = 8; // 戊癸 -> 壬子
                const stemIndex = (baseGan + hourIndex) % 10;
                const branchIndex = hourIndex % 12;
                return HEAVEN_STEMS[stemIndex] + EARTH_BRANCHES[branchIndex];
            }

            // ==================== 积时数 ====================
            function calcJishishu(year, month, day, hourIndex) {
                const diffDays = daysBetween(BASE_YEAR, BASE_MONTH, BASE_DAY, year, month, day);
                const diffHours = diffDays * 12 + (hourIndex - BASE_HOUR_INDEX);
                if (diffHours >= 0) {
                    return BASE_Z + diffHours;
                } else {
                    return BASE_Z + diffHours;
                }
            }

            // ==================== 阴阳遁 ====================
            function calcFlag(year, month, day, autoFlag) {
                if (autoFlag === 'auto') {
                    const xiazhi = getSolarTerm(year, 'xiazhi');
                    const dongzhi = getSolarTerm(year, 'dongzhi');
                    const afterXiazhi = isAfterDate(year, month, day, year, xiazhi[0], xiazhi[1]) ||
                        isSameDate(year, month, day, year, xiazhi[0], xiazhi[1]);
                    const beforeDongzhi = isBeforeDate(year, month, day, year, dongzhi[0], dongzhi[1]);
                    if (afterXiazhi && beforeDongzhi) return 0; // 阴遁
                    const afterDongzhi = isAfterDate(year, month, day, year, dongzhi[0], dongzhi[1]) ||
                        isSameDate(year, month, day, year, dongzhi[0], dongzhi[1]);
                    const beforeXiazhi = isBeforeDate(year, month, day, year, xiazhi[0], xiazhi[1]);
                    if (afterDongzhi && beforeXiazhi) return 1; // 阳遁
                    if (afterDongzhi) return 1;
                    if (afterXiazhi && beforeDongzhi) return 0;
                    if (afterXiazhi) return 0;
                    return 1;
                } else if (autoFlag === 'yang') {
                    return 1;
                } else {
                    return 0;
                }
            }

            // ==================== 计算主算/客算/定算 ====================
            function calcSuan(startS, endS) {
                if (startS === endS) {
                    return S_VALUES[startS];
                }
                const startIdx = CW_ORDER.indexOf(startS);
                const endIdx = CW_ORDER.indexOf(endS);
                let positions = [];
                let i = startIdx;
                while (true) {
                    positions.push(CW_ORDER[i]);
                    if (CW_ORDER[i] === endS) break;
                    i = (i + 1) % CW_ORDER.length;
                }
                // 去掉最后一位（endS），因为需要到endS的前一位
                positions = positions.slice(0, -1);
                if (positions.length === 0) return S_VALUES[startS];
                let sum = 0;
                for (const s of positions) {
                    sum += S_VALUES[s];
                }
                // 减去值为1的位置数
                for (const s of positions) {
                    if (S_VALUES[s] === 1) sum -= 1;
                }
                // 如果起始位置值为1，再加1
                if (S_VALUES[startS] === 1) sum += 1;
                // 如果经过s1且起始不是s1，再加1
                if (positions.includes('s1') && startS !== 's1') sum += 1;
                return sum;
            }

            function getOnesDigit(num) {
                const abs = Math.abs(num);
                return abs % 10;
            }

            function calcDaJiang(suanValue) {
                if (suanValue === 0) return 0;
                const ones = getOnesDigit(suanValue);
                if (ones === 0) {
                    return suanValue % 9;
                }
                return ones;
            }

            function getCellBySuanValue(val) {
                if (val === 1) return 's1';
                if (val === 2) return 's11';
                if (val === 3) return 's5';
                if (val === 4) return 's7';
                if (val === 5) return 'center';
                if (val === 6) return 's15';
                if (val === 7) return 's13';
                if (val === 8) return 's3';
                if (val === 9) return 's9';
                return 'center';
            }

            function getCanJiangByDaJiang(dajiangS) {
                if (dajiangS === 'center') {
                    const centerVal = 5;
                    const multiplied = (centerVal * 3) % 10;
                    return getCellBySuanValue(multiplied);
                }
                const val = S_VALUES[dajiangS];
                const multiplied = (val * 3) % 10;
                return getCellBySuanValue(multiplied);
            }

            function getCWDistance(fromS, toS) {
                const fromIdx = CW_ORDER.indexOf(fromS);
                const toIdx = CW_ORDER.indexOf(toS);
                let dist = 0;
                let i = fromIdx;
                while (CW_ORDER[i] !== toS) {
                    dist++;
                    i = (i + 1) % CW_ORDER.length;
                }
                return dist;
            }

            function moveCW(s, steps) {
                const idx = CW_ORDER.indexOf(s);
                return CW_ORDER[(idx + steps) % CW_ORDER.length];
            }

            // ==================== 八门计算 ====================
            function getBaguaIndexByTaiji(taijiS) {
                const mapping = {
                    's1': '乾',
                    's3': '坎',
                    's5': '艮',
                    's7': '震',
                    's9': '巽',
                    's11': '离',
                    's13': '坤',
                    's15': '兑'
                };
                return mapping[taijiS] || '乾';
            }

            function getBaguaByIndex(index) {
                return BAGUA_CW_ORDER[((index % 8) + 8) % 8];
            }

            // ==================== 主要计算 ====================
            function performCalculation() {
                const year = parseInt(document.getElementById('inputYear').value) || 2026;
                const month = parseInt(document.getElementById('inputMonth').value) || 8;
                const day = parseInt(document.getElementById('inputDay').value) || 15;
                const hourIndex = parseInt(document.getElementById('inputHour').value) || 0;

                const autoYang = document.getElementById('chkYang').checked;
                const autoYin = document.getElementById('chkYin').checked;
                let autoFlag = 'auto';
                if (autoYang && !autoYin) autoFlag = 'yang';
                else if (autoYin && !autoYang) autoFlag = 'yin';

                clearAllCells();

                // 初始角落文字
                setCornerText(2, 2, 'br', '巽');
                setCornerText(2, 2, 'bl', '九');
                setCornerText(2, 3, 'br', '离');
                setCornerText(2, 3, 'bl', '二');
                setCornerText(2, 4, 'br', '坤');
                setCornerText(2, 4, 'bl', '七');
                setCornerText(3, 2, 'br', '震');
                setCornerText(3, 2, 'bl', '四');
                setCornerText(3, 4, 'br', '兑');
                setCornerText(3, 4, 'bl', '六');
                setCornerText(4, 2, 'br', '艮');
                setCornerText(4, 2, 'bl', '三');
                setCornerText(4, 3, 'br', '坎');
                setCornerText(4, 3, 'bl', '八');
                setCornerText(4, 4, 'br', '乾');
                setCornerText(4, 4, 'bl', '一');

                // 计算积时数
                const z = calcJishishu(year, month, day, hourIndex);

                // 计算flag
                const flag = calcFlag(year, month, day, autoFlag);

                // 干支
                const yearGZ = getYearGanzhi(year, month, day);
                const monthGZ = getMonthGanzhi(year, month, day, yearGZ);
                const dayGZ = getDayGanzhi(year, month, day);
                const hourGZ = getHourGanzhi(dayGZ, hourIndex);
				const kongWang = getKongWang(dayGZ);

                // 阴阳遁
                const y = z % 72;
                const yDun = y === 0 ? 72 : y;
                const dunType = flag === 1 ? '阳遁' : '阴遁';
                const dunOutput = `${dunType}${yDun}局`;

                // 太乙
                const a1 = z % 24;
                let taijiS;
                if (a1 >= 1 && a1 <= 3) {
                    taijiS = flag === 1 ? 's1' : 's9';
                } else if (a1 >= 4 && a1 <= 6) {
                    taijiS = flag === 1 ? 's11' : 's3';
                } else if (a1 >= 7 && a1 <= 9) {
                    taijiS = flag === 1 ? 's5' : 's13';
                } else if (a1 >= 10 && a1 <= 12) {
                    taijiS = flag === 1 ? 's7' : 's15';
                } else if (a1 >= 13 && a1 <= 15) {
                    taijiS = flag === 1 ? 's15' : 's7';
                } else if (a1 >= 16 && a1 <= 18) {
                    taijiS = flag === 1 ? 's13' : 's5';
                } else if (a1 >= 19 && a1 <= 21) {
                    taijiS = flag === 1 ? 's3' : 's11';
                } else {
                    taijiS = flag === 1 ? 's9' : 's1';
                }
                addSCellText(taijiS, '太乙');

                // 文昌
                const b = z % 18;
                let wenchangS;
                if (b === 1) wenchangS = flag === 1 ? 's14' : 's6';
                else if (b === 2) wenchangS = flag === 1 ? 's15' : 's7';
                else if (b === 3) wenchangS = flag === 1 ? 's16' : 's8';
                else if (b === 4) wenchangS = flag === 1 ? 's1' : 's9';
                else if (b === 5) wenchangS = flag === 1 ? 's1' : 's9';
                else if (b === 6) wenchangS = flag === 1 ? 's2' : 's10';
                else if (b === 7) wenchangS = flag === 1 ? 's3' : 's11';
                else if (b === 8) wenchangS = flag === 1 ? 's4' : 's12';
                else if (b === 9) wenchangS = flag === 1 ? 's5' : 's13';
                else if (b === 10) wenchangS = flag === 1 ? 's6' : 's14';
                else if (b === 11) wenchangS = flag === 1 ? 's7' : 's15';
                else if (b === 12) wenchangS = flag === 1 ? 's8' : 's16';
                else if (b === 13) wenchangS = flag === 1 ? 's9' : 's1';
                else if (b === 14) wenchangS = flag === 1 ? 's10' : 's2';
                else if (b === 15) wenchangS = flag === 1 ? 's11' : 's3';
                else if (b === 16) wenchangS = flag === 1 ? 's12' : 's4';
                else if (b === 17) wenchangS = flag === 1 ? 's13' : 's5';
                else wenchangS = flag === 1 ? 's13' : 's5';
                addSCellText(wenchangS, '文昌');

                // 主算
                const s17 = calcSuan(wenchangS, taijiS);

                // 主大将
                const s18 = calcDaJiang(s17);
                const zhuDaJiangCell = getCellBySuanValue(s18);
                if (zhuDaJiangCell === 'center') {
                    addCellText(3, 3, '主大将');
                } else {
                    addSCellText(zhuDaJiangCell, '主大将');
                }

                // 主参将
                const zhuCanJiangCell = getCanJiangByDaJiang(zhuDaJiangCell);
                if (zhuCanJiangCell === 'center') {
                    addCellText(3, 3, '主参将');
                } else {
                    addSCellText(zhuCanJiangCell, '主参将');
                }

                // 计神
                let jishenS;
                if (flag === 1) {
                    const hourMap = { 0: 's6', 1: 's4', 2: 's3', 3: 's2', 4: 's16', 5: 's15', 6: 's14', 7: 's12', 8: 's11',
                        9: 's2', 10: 's8', 11: 's7' };
                    jishenS = hourMap[hourIndex] || 's6';
                } else {
                    const hourMap = { 0: 's14', 1: 's12', 2: 's11', 3: 's10', 4: 's8', 5: 's7', 6: 's6', 7: 's4', 8: 's3',
                        9: 's2', 10: 's16', 11: 's15' };
                    jishenS = hourMap[hourIndex] || 's14';
                }
                addSCellText(jishenS, '计神');

                // 始击
                let shijiS;
                if (jishenS !== 's5') {
                    const c1 = getCWDistance(jishenS, 's5');
                    shijiS = moveCW(wenchangS, c1);
                } else {
                    shijiS = wenchangS;
                }
                addSCellText(shijiS, '始击');

                // 客算
                const s21 = calcSuan(shijiS, taijiS);

                // 客大将
                const s22 = calcDaJiang(s21);
                const keDaJiangCell = getCellBySuanValue(s22);
                if (keDaJiangCell === 'center') {
                    addCellText(3, 3, '客大将');
                } else {
                    addSCellText(keDaJiangCell, '客大将');
                }

                // 客参将
                const keCanJiangCell = getCanJiangByDaJiang(keDaJiangCell);
                if (keCanJiangCell === 'center') {
                    addCellText(3, 3, '客参将');
                } else {
                    addSCellText(keCanJiangCell, '客参将');
                }

                // 太岁
                const taisuiMap = { 0: 's3', 1: 's4', 2: 's6', 3: 's7', 4: 's8', 5: 's10', 6: 's11', 7: 's12', 8: 's14',
                    9: 's15', 10: 's16', 11: 's2' };
                const taisuiS = taisuiMap[hourIndex] || 's3';
                addSCellText(taisuiS, '太岁');

                // 太阴
                const taiyinMap = { 2: 's3', 3: 's4', 4: 's6', 5: 's7', 6: 's8', 7: 's10', 8: 's11', 9: 's12', 10: 's14',
                    11: 's15', 0: 's16', 1: 's2' };
                const taiyinS = taiyinMap[hourIndex] || 's16';
                addSCellText(taiyinS, '太阴');

                // 合神
                const heshenMap = { 's3': 's4', 's4': 's3', 's6': 's2', 's7': 's16', 's8': 's15', 's10': 's14', 's11': 's12',
                    's12': 's11', 's14': 's10', 's15': 's8', 's16': 's7', 's2': 's6' };
                const heshenS = heshenMap[taisuiS] || taisuiS;
                addSCellText(heshenS, '合神');

                // 定目
                const v1 = getCWDistance(heshenS, taisuiS);
                const dingmuS = moveCW(wenchangS, v1);
                addSCellText(dingmuS, '定目');

                // 定算
                const s25 = calcSuan(dingmuS, taijiS);

                // 定大将
                const s26 = calcDaJiang(s25);
                const dingDaJiangCell = getCellBySuanValue(s26);
                if (dingDaJiangCell === 'center') {
                    addCellText(3, 3, '定大将');
                } else {
                    addSCellText(dingDaJiangCell, '定大将');
                }

                // 定参将
                const dingCanJiangCell = getCanJiangByDaJiang(dingDaJiangCell);
                if (dingCanJiangCell === 'center') {
                    addCellText(3, 3, '定参将');
                } else {
                    addSCellText(dingCanJiangCell, '定参将');
                }

                // 君基
                const z9 = (z + 250) % 360;
                const z10 = Math.ceil(z9 / 30);
                const junjiMap = { 1: 's11', 2: 's12', 3: 's14', 4: 's15', 5: 's16', 6: 's2', 7: 's3', 8: 's4', 9: 's6',
                    10: 's7', 11: 's8', 12: 's10', 0: 's10' };
                const junjiS = junjiMap[z10] || 's10';
                addSCellText(junjiS, '君基');

                // 臣基
                const z13 = (z + 250) % 360;
                const z14 = z13 % 36;
                const z15 = Math.ceil(z14 / 3);
                const chenjiMap = { 1: 's11', 2: 's12', 3: 's14', 4: 's15', 5: 's16', 6: 's2', 7: 's3', 8: 's4', 9: 's6',
                    10: 's7', 11: 's8', 12: 's10', 0: 's10' };
                const chenjiS = chenjiMap[z15] || 's10';
                addSCellText(chenjiS, '臣基');

                // 民基
                const z11 = (z + 250) % 360;
                const z12 = z11 % 12;
                const minjiMap = { 1: 's16', 2: 's2', 3: 's3', 4: 's4', 5: 's6', 6: 's7', 7: 's8', 8: 's10', 9: 's11',
                    10: 's12', 11: 's14', 0: 's15' };
                const minjiS = minjiMap[z12] || 's15';
                addSCellText(minjiS, '民基');

                // 五福
                const z50 = (z + 250) % 225;
                const z51 = Math.ceil(z50 / 45);
                const wufuMap = { 1: 's1', 2: 's5', 3: 's9', 4: 's13', 5: 'center', 0: 'center' };
                const wufuCell = wufuMap[z51] || 'center';
                if (wufuCell === 'center') {
                    addCellText(3, 3, '五福');
                } else {
                    addSCellText(wufuCell, '五福');
                }

                // 大游
                const z60 = (z + 32) % 288;
                const z61 = Math.ceil(z60 / 36);
                const dayouMap = { 1: 's13', 2: 's3', 3: 's9', 4: 's1', 5: 's11', 6: 's5', 7: 's7', 8: 's15', 0: 's15' };
                const dayouS = dayouMap[z61] || 's15';
                addSCellText(dayouS, '大游');

                // 小游
                const z70 = z % 360;
                const z71 = z70 % 24;
                const z72 = Math.ceil(z71 / 3);
                const xiaoyouMap = { 1: 's1', 2: 's11', 3: 's5', 4: 's7', 5: 's15', 6: 's13', 7: 's3', 8: 's9', 0: 's9' };
                const xiaoyouS = xiaoyouMap[z72] || 's9';
                addSCellText(xiaoyouS, '小游');

                // 四神
                const z80 = z % 360;
                const z81 = z80 % 36;
                const z82 = Math.ceil(z81 / 3);
                const sishenMap = { 1: 's1', 2: 's11', 3: 's5', 4: 's7', 5: 'center', 6: 's15', 7: 's13', 8: 's3', 9: 's9',
                    10: 's10', 11: 's14', 12: 's6', 0: 's6' };
                const sishenCell = sishenMap[z82] || 's6';
                if (sishenCell === 'center') {
                    addCellText(3, 3, '四神');
                } else {
                    addSCellText(sishenCell, '四神');
                }

                // 天乙
                const z90 = z % 360;
                const z91 = z90 % 36;
                const z92 = Math.ceil(z91 / 3);
                const tianyiMap = { 1: 's15', 2: 's13', 3: 's3', 4: 's9', 5: 's10', 6: 's14', 7: 's6', 8: 's1', 9: 's11',
                    10: 's5', 11: 's7', 12: 'center', 0: 'center' };
                const tianyiCell = tianyiMap[z92] || 'center';
                if (tianyiCell === 'center') {
                    addCellText(3, 3, '天乙');
                } else {
                    addSCellText(tianyiCell, '天乙');
                }

                // 地乙
                const z97 = z % 360;
                const z98 = z97 % 36;
                const z99 = Math.ceil(z98 / 3);
                const diyiMap = { 1: 's9', 2: 's10', 3: 's14', 4: 's6', 5: 's1', 6: 's11', 7: 's5', 8: 's7', 9: 'center',
                    10: 's15', 11: 's13', 12: 's3', 0: 's3' };
                const diyiCell = diyiMap[z99] || 'center';
                if (diyiCell === 'center') {
                    addCellText(3, 3, '地乙');
                } else {
                    addSCellText(diyiCell, '地乙');
                }

                // 直符
                const z100 = z % 360;
                const z101 = z100 % 36;
                const z102 = Math.ceil(z101 / 3);
                const zhifuMap = { 1: 'center', 2: 's15', 3: 's13', 4: 's3', 5: 's9', 6: 's10', 7: 's14', 8: 's6', 9: 's1',
                    10: 's11', 11: 's5', 12: 's7', 0: 's7' };
                const zhifuCell = zhifuMap[z102] || 's7';
                if (zhifuCell === 'center') {
                    addCellText(3, 3, '直符');
                } else {
                    addSCellText(zhifuCell, '直符');
                }

                // 青龙旗
                const zl = z % 12;
                const qinglongMap = { 1: 's3', 2: 's4', 3: 's6', 4: 's7', 5: 's8', 6: 's10', 7: 's11', 8: 's12', 9: 's14',
                    10: 's15', 11: 's16', 0: 's2' };
                const qinglongS = qinglongMap[zl] || 's2';
                addSCellText(qinglongS, '青龙旗');

                // 太阴黑旗
                const zh = (z + 25) % 36;
                const zh1 = Math.ceil(zh / 3);
                const heiqiMap = { 1: 's2', 2: 's16', 3: 's15', 4: 's14', 5: 's12', 6: 's11', 7: 's10', 8: 's8', 9: 's7',
                    10: 's6', 11: 's4', 12: 's3', 0: 's3' };
                const heiqiS = heiqiMap[zh1] || 's3';
                addSCellText(heiqiS, '黑旗');

                // 害气赤旗
                const zq = (z + 1) % 4;
                const chiqiMap = { 1: 's2', 2: 's14', 3: 's10', 0: 's6' };
                const chiqiS = chiqiMap[zq] || 's6';
                addSCellText(chiqiS, '赤旗');

                // 八门
                const zb1 = z % 240;
                const zb2 = Math.ceil(zb1 / 30);
                let jj;
                if (flag === 1) {
                    const map = { 1: 'j1', 2: 'j2', 3: 'j3', 4: 'j4', 5: 'j5', 6: 'j6', 7: 'j7', 8: 'j8', 0: 'j8' };
                    jj = map[zb2] || 'j8';
                } else {
                    const map = { 1: 'j5', 2: 'j6', 3: 'j7', 4: 'j8', 5: 'j1', 6: 'j2', 7: 'j3', 8: 'j4', 0: 'j4' };
                    jj = map[zb2] || 'j4';
                }
                const jjStr = EIGHT_DOORS[jj];

                // 确定jj所在的八宫单元格
                const jjBaguaIndex = getBaguaIndexByTaiji(taijiS);
                const jjBaguaPos = BAGUA_CELLS[jjBaguaIndex];
                const jjBaguaStart = jjBaguaPos;

                // 在八宫单元格中写入八门
                const jjIdx = EIGHT_DOORS_CW.indexOf(jj);
                const baguaStartIdx = BAGUA_CW_ORDER.indexOf(jjBaguaIndex);
                for (let k = 0; k < 8; k++) {
                    const doorIdx = (jjIdx + k) % 8;
                    const doorKey = EIGHT_DOORS_CW[doorIdx];
                    const doorName = EIGHT_DOORS[doorKey];
                    const baguaIdx = (baguaStartIdx + k) % 8;
                    const baguaName = BAGUA_CW_ORDER[baguaIdx];
                    const cellPos = BAGUA_CELLS[baguaName];
                    addCellText(cellPos.row, cellPos.col, doorName);
                }

                // 更新显示
                updateTableDisplay();
                updateOutputDisplay({
                    z: z,
                    yearGZ: yearGZ,
                    monthGZ: monthGZ,
                    dayGZ: dayGZ,
                    hourGZ: hourGZ,
					kongWang: kongWang,
                    dunOutput: dunOutput,
                    s17: s17,
                    s21: s21,
                    s25: s25,
                    jjStr: jjStr,
                    flag: flag
                });
            }

            // ==================== 表格渲染 ====================
            function buildTable() {
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                for (let r = 1; r <= 5; r++) {
                    const tr = document.createElement('tr');
                    for (let c = 1; c <= 5; c++) {
                        const td = document.createElement('td');
                        td.id = `cell_${r}_${c}`;
                        td.innerHTML = `
                            <div class="cell-content" id="content_${r}_${c}"></div>
                            <span class="corner-bl" id="corner_bl_${r}_${c}"></span>
                            <span class="corner-br" id="corner_br_${r}_${c}"></span>
                        `;
                        tr.appendChild(td);
                    }
                    tbody.appendChild(tr);
                }
            }

            function updateTableDisplay() {
                for (let r = 1; r <= 5; r++) {
                    for (let c = 1; c <= 5; c++) {
                        const key = getCellKey(r, c);
                        const contentDiv = document.getElementById(`content_${r}_${c}`);
                        const blSpan = document.getElementById(`corner_bl_${r}_${c}`);
                        const brSpan = document.getElementById(`corner_br_${r}_${c}`);
                        if (!contentDiv) continue;
                        const texts = cellTexts[key] || [];
                        contentDiv.innerHTML = '';
                        for (const text of texts) {
                            const span = document.createElement('span');
                            span.className = 'word-block';
                            span.textContent = text;
                            contentDiv.appendChild(span);
                        }
                        const corner = cornerTexts[key] || { br: '', bl: '' };
                        blSpan.textContent = corner.bl || '';
                        brSpan.textContent = corner.br || '';
                    }
                }
            }

            function updateOutputDisplay(data) {
                const area = document.getElementById('outputArea');
                let html = '';
                html +=
                    `<div class="output-line"><span class="label">积时数：</span>${data.z}</div>`;
                html += `<div class="output-line"><span class="label">${data.dunOutput}</span></div>`;
                //html +=
                    //`<div class="output-line"><span class="label">年干支：</span><span id="outYearGZ">${data.yearGZ}</span> <span class="label">月干支：</span><span id="outMonthGZ">${data.monthGZ}</span> <span class="label">日干支：</span><span id="outDayGZ">${data.dayGZ}</span> <span class="label">时干支：</span><span id="outHourGZ">${data.hourGZ}</span></div>`;
                html += `<div class="output-line"><span class="label">主算：</span>${data.s17}</div>`;
                html += `<div class="output-line"><span class="label">客算：</span>${data.s21}</div>`;
                html += `<div class="output-line"><span class="label">定算：</span>${data.s25}</div>`;
                html += `<div class="output-line"><span class="label">值使门：</span>${data.jjStr}</div>`;
				if (data.kongWang) {
					html += `<div class="output-line"><span class="label">${data.kongWang}</span></div>`;
				}
				
				
				
                area.innerHTML = html;

                document.getElementById('editYearGZ').value = data.yearGZ;
                document.getElementById('editMonthGZ').value = data.monthGZ;
                document.getElementById('editDayGZ').value = data.dayGZ;
                document.getElementById('editHourGZ').value = data.hourGZ;
            }

            // ==================== 事件绑定 ====================
            function initEvents() {
                document.getElementById('btnCalc').addEventListener('click', performCalculation);
                document.getElementById('btnMinusHour').addEventListener('click', function() {
                    let hour = parseInt(document.getElementById('inputHour').value) || 0;
                    hour = (hour - 1 + 12) % 12;
                    document.getElementById('inputHour').value = hour;
                    performCalculation();
                });
                document.getElementById('btnPlusHour').addEventListener('click', function() {
                    let hour = parseInt(document.getElementById('inputHour').value) || 0;
                    hour = (hour + 1) % 12;
                    document.getElementById('inputHour').value = hour;
                    performCalculation();
                });

                const chkYang = document.getElementById('chkYang');
                const chkYin = document.getElementById('chkYin');
                const chkAuto = document.getElementById('chkAuto');
                chkYang.addEventListener('change', function() {
                    if (chkYang.checked) { chkYin.checked = false;
                        chkAuto.checked = false; }
                    performCalculation();
                });
                chkYin.addEventListener('change', function() {
                    if (chkYin.checked) { chkYang.checked = false;
                        chkAuto.checked = false; }
                    performCalculation();
                });
                chkAuto.addEventListener('change', function() {
                    if (chkAuto.checked) { chkYang.checked = false;
                        chkYin.checked = false; }
                    performCalculation();
                });

                const ganZhiInputs = ['editYearGZ', 'editMonthGZ', 'editDayGZ', 'editHourGZ'];
                ganZhiInputs.forEach(id => {
                    document.getElementById(id).addEventListener('change', function() {
                        // 允许用户修改显示，不影响计算
                        const area = document.getElementById('outputArea');
                        const spans = area.querySelectorAll('#outYearGZ, #outMonthGZ, #outDayGZ, #outHourGZ');
                        if (id === 'editYearGZ') {
                            const span = area.querySelector('#outYearGZ');
                            if (span) span.textContent = this.value;
                        }
                        if (id === 'editMonthGZ') {
                            const span = area.querySelector('#outMonthGZ');
                            if (span) span.textContent = this.value;
                        }
                        if (id === 'editDayGZ') {
                            const span = area.querySelector('#outDayGZ');
                            if (span) span.textContent = this.value;
                        }
                        if (id === 'editHourGZ') {
                            const span = area.querySelector('#outHourGZ');
                            if (span) span.textContent = this.value;
                        }
                    });
                });

                document.getElementById('inputYear').addEventListener('change', performCalculation);
                document.getElementById('inputMonth').addEventListener('change', performCalculation);
                document.getElementById('inputDay').addEventListener('change', performCalculation);
                document.getElementById('inputHour').addEventListener('change', performCalculation);
            }

            function initDefaultDate() {
                const now = new Date();
                document.getElementById('inputYear').value = now.getFullYear();
                document.getElementById('inputMonth').value = now.getMonth() + 1;
                document.getElementById('inputDay').value = now.getDate();
                document.getElementById('inputHour').value = getCurrentHourIndex();
            }

            // ==================== 启动 ====================
            function init() {
                buildTable();
                initDefaultDate();
                initEvents();
                performCalculation();
            }

            init();
        })();
    </script>
</body>
</html>
